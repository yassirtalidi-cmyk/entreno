    h+=`<div class="card game"><div class="lvl"><div class="lvlbadge">${g.L}</div><div class="stack" style="gap:6px"><b>${esc(g.title)} · ${g.xp} XP</b><div class="bar ember"><span style="width:${clamp(100*(g.xp-g.cur)/(g.next-g.cur),0,100)}%"></span></div><span class="small muted">Racha actual ${g.streak} días · jefes derrotados ${g.bossKills}</span></div></div>
     <p class="small muted">Títulos: ${TITLES.map(t=>t[1]+" (nv. "+t[0]+")").join(" · ")}.</p></div>
     <div class="card"><div class="row between"><h3>Medallas</h3><span class="small muted">${got} de ${g.badges.length}</span></div><div class="badges">${g.badges.map(b=>`<div class="bdg ${b[3]?"on":"off"}" title="${esc(b[2])}">${badgeIcon(b[0],b[3])}<b>${esc(b[1])}</b><span class="muted">${esc(b[2])}</span></div>`).join("")}</div></div>${viewRanks()}
     <details class="card"><summary>Cómo se gana XP</summary><div class="small stack" style="gap:4px;margin-top:8px"><span>Cada comida registrada +5 (máx. 5) · proteína del día +30 · calorías en tu rango ±10 % +20 · verdura en 2 comidas +10 · agua +10</span><span>Cada serie hecha +4 (máx. 30) · sesión completa +40 · récord +25 · descanso activo +20</span><span>Mente +3 por minuto (máx. 45) · check-in +10 · pesada +5 · reto de la ruleta +20 · día perfecto +50</span><span class="muted">Comer menos de tu objetivo no da puntos.</span></div></details>`}
  else if(yoView==="cuerpo"){const pts=Object.entries(S.body).filter(([d,v])=>v&&v.kg&&d>=addDays(today(),-120)).sort().map(([d,v])=>({d,a:v.kg}));
    let trend="";if(pts.length>=4){const a=pts.slice(-7),b=pts.filter(x=>x.d<a[0].d).slice(-7);if(b.length){const ma=a.reduce((s,x)=>s+x.a,0)/a.length,mb=b.reduce((s,x)=>s+x.a,0)/b.length;const wk=Math.max(1,(new Date(a[a.length-1].d)-new Date(b[b.length-1].d))/6048e5);trend=`Tendencia: ${ma-mb>0?"+":""}${fmt((ma-mb)/wk,2)} kg por semana (media de tus pesadas).`}}
    h+=`<div class="card"><h3>Peso</h3><div class="row" style="flex-wrap:nowrap"><input class="cell" inputmode="decimal" id="wKg" placeholder="kg" value="${S.body[today()]?fmt0(S.body[today()].kg):""}" style="max-width:120px" aria-label="Peso de hoy"><button data-act="weigh">Guardar peso de hoy</button></div>
     ${pts.length>=2?lineChart(pts,{dec:1}):`<div class="empty">Con 2 pesadas verás tu gráfica.</div>`}<p class="small muted">${trend||"El peso sube y baja 1-2 kg de un día a otro por agua y sal. Mira la tendencia, no el dato suelto."}</p>
     ${S.profile&&pts.length&&Math.abs(pts[pts.length-1].a-S.profile.peso)>=1.5?`<div class="note">Tu peso ha cambiado ${fmt(pts[pts.length-1].a-S.profile.peso)} kg desde que se calcularon tus objetivos. <button class="small" data-act="retarget">Recalcular objetivos</button></div>`:""}</div>`;
    const adult=S.profile.edad>=18;
    if(!LOCAL)h+=`<div class="card"><h3>Foto de cuerpo (opcional)</h3>${adult?`<p class="small muted">Claude te da un rango orientativo de grasa y qué priorizar en el entreno. La foto se envía solo para este análisis y no se guarda en la app; solo se guarda el texto.</p>
     <input type="file" id="bodyIn" accept="image/*" hidden>${pendingBody?`<img class="photo-prev" src="${pendingBody.url}" alt="Tu foto"><div class="row">${aiBtn("ai-body","Analizar con Claude",!AI_IMG)}<button class="ghost" data-act="body-cancel">Descartar</button></div>`:`<button data-act="body-photo" ${AI&&AI_IMG?"":"disabled"}>Elegir foto</button>`}
     <div class="ai" id="aiBodyOut">${esc(S.profile.cuerpoAI?S.profile.cuerpoAI.text:"")}</div>${S.profile.cuerpoAI?`<p class="small muted">Análisis del ${dmy(S.profile.cuerpoAI.date)}</p>`:""}${aviso("cuerpo")}`:`<p class="small muted">Disponible a partir de 18 años. Para seguir tu progreso usa el peso, las marcas y tus rangos.</p>`}</div>`}
  else{const p=S.profile;
    h+=`<div class="card"><div class="row between"><h3>${esc(p.nombre||"Tu perfil")}</h3><button data-act="edit-profile">Editar</button></div>
     <p class="small">${p.sexo==="m"?"Hombre":"Mujer"} · ${p.edad} años · ${p.altura} cm · ${fmt(p.peso)} kg · ${esc(GOALS[p.objetivo].n)} · ${p.diasEntreno} días × ${p.minutos} min · ${({gym:"gimnasio",casa:"casa",peso:"peso corporal"})[p.material]}</p>
     ${injured().length?`<p class="small">Lesiones: ${injured().map(z=>ZONES[z]).join(", ")}</p>`:""}${p.dieta.restr.length?`<p class="small">No come: ${esc(p.dieta.restr.join(", "))}</p>`:""}</div>
     <div class="card"><h3>Objetivos diarios</h3>${targetsTable()}</div>
     <div class="card"><h3>Tus datos</h3><p class="small muted">${syncMode==="ok"?"Se guardan en tu cuenta, en un espacio privado que solo ves tú, y en este dispositivo.":"Ahora mismo solo se guardan en este dispositivo."} Puedes descargar una copia o cargarla en otro sitio.</p>
     <div class="row"><button data-act="export">Descargar copia</button><button data-act="import">Cargar copia</button><input type="file" id="importIn" accept="application/json,.json" hidden></div>
     <button class="ghost small" data-act="reset" style="color:var(--down)">${resetArm?"Pulsa otra vez: se borra todo y no se puede deshacer":"Borrar todos mis datos"}</button></div>
     <div class="note">Gymnarly da orientación general de entreno y nutrición. No es consejo médico. Con una enfermedad, un trastorno de la conducta alimentaria, embarazo o una lesión seria, consulta a un profesional.</div>`}
  return h;
}
let resetArm=false;
/* ================= PINTAR ================= */
let tab="hoy";
let lastKey="";
function render(){
  const v=$("#view");if(!v)return;const tabs=$("#tabs");
  if(!S.profile||obEdit){tabs.hidden=true;$("#meBtn").hidden=true;document.body.dataset.tab="ob";if(!ob){ob=obDefaults();obStep=0}const k="ob"+obStep;v.innerHTML=viewOnboarding();enter(v,k);return}
  tabs.hidden=false;document.body.dataset.tab=tab;
  const order=["hoy","comida","entreno","mente","amigos"];const ti=order.indexOf(tab);tabs.style.setProperty("--n",order.length);tabs.style.setProperty("--i",Math.max(0,ti));$(".ind",tabs).style.opacity=ti<0?0:1;
  $$("#tabs button").forEach(b=>{if(b.dataset.tab===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  const g=game();const mb=$("#meBtn");mb.hidden=false;$("#meLv").textContent=g.L;$("#meTxt").textContent=g.title;
  let h="";
  if(tab==="hoy"){h=viewHoy();if(S.plan&&S.plan.origen==="plantilla"&&AI&&!S.meta.hidePlanTip)h+=`<div class="note">Tu plan es la plantilla estándar. En Entreno → Mi plan puedes pedir a Claude uno hecho a tu medida. <button class="small ghost" data-act="hide-tip">Entendido</button></div>`}
  else if(tab==="comida")h=viewComida();else if(tab==="entreno")h=viewEntreno();else if(tab==="mente")h=viewMente();else if(tab==="amigos")h=viewAmigos();else h=viewYo();
  v.innerHTML=h;
  enter(v,tab+"/"+trainView+foodView+mindView+yoView+selDay);
}
/* animación de entrada solo al cambiar de pantalla, no en cada guardado */
function enter(v,key){if(key===lastKey)return;lastKey=key;v.classList.remove("enter");void v.offsetWidth;v.classList.add("enter");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const nf=f=>requestAnimationFrame(()=>requestAnimationFrame(f));
  $$(".dayring .arc",v).forEach(a=>{const off=a.getAttribute("data-off"),c=a.getAttribute("data-c");a.style.transition="none";a.style.strokeDashoffset=c;nf(()=>{a.style.transition="";a.style.strokeDashoffset=off})});
  $$(".ring .arc",v).forEach(a=>{const d=a.getAttribute("data-dash");a.style.transition="none";a.style.strokeDasharray="0 999";nf(()=>{a.style.transition="stroke-dasharray 1.2s cubic-bezier(.2,.9,.25,1)";a.style.strokeDasharray=d})});
  $$(".bar>span",v).forEach(sp=>{const w=sp.style.width;sp.style.transition="none";sp.style.width="0%";nf(()=>{sp.style.transition="";sp.style.width=w})});
  $$("[data-count]",v).forEach(el=>{const to=+el.dataset.count;if(!(to>1))return;const t0=performance.now();const st=()=>{const k=Math.min(1,(performance.now()-t0)/900);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};st()});
}
/* ================= ACCIONES ================= */
function saveCheckin(){const d=day(today(),true);const c=d.checkin||{};const s=$("#ciSleep"),n=$("#ciNote");if(s)c.sueno=num(s.value);if(n)c.nota=n.value;d.checkin=c;saveDay(today())}
function setInput(id,i,f,val){const ses=curSession(true);const e=ses.ex[id]||(ses.ex[id]={sets:[]});while(e.sets.length<=i)e.sets.push({});e.sets[i][f]=val;saveSession(ses);return e.sets[i]}
function readRow(id,i){const g=f=>{const el=$(`[data-f="${id}:${i}:${f}"]`);return el?num(el.value):null};return {kg:g("kg"),reps:g("reps"),rir:g("rir")}}
function goTab(t){tab=t;render();window.scrollTo(0,0)}
async function doExport(){const data=JSON.stringify(Object.assign({app:"gymnarly",version:1,exported:new Date().toISOString()},S),null,1);const fn="gymnarly-"+today()+".json";
  try{const dl=window.claude&&await window.claude.use("downloads");if(dl){await dl.save({filename:fn,data});return}}catch(e){if(e&&e.code&&e.code!=="unavailable"){toast("No se descargó ("+e.code+")");return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=fn;a.click()}
function allKeys(){return ["profile","plan","meta","body",...Object.keys(S.days).map(k=>"d-"+k),...Object.keys(S.sessions).map(k=>"s-"+k)]}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-obset]");if(!b||b.disabled)return;const D=b.dataset;
  if(S.profile&&!lastGame)lastGame=snapshot();
  if(D.tab){goTab(D.tab);return}
  if(D.go){goTab(D.go);return}
  if(D.ai){runAI(D.ai,b);return}
  /* bienvenida */
  if(D.obset){obCollect();const [k,v]=D.obset.split(":");const val=/^\d+$/.test(v)?+v:v;if(k.startsWith("dieta."))ob.dieta[k.slice(6)]=val;else ob[k]=val;obErr="";render();return}
  if(D.obles){obCollect();if(ob.lesiones[D.obles])delete ob.lesiones[D.obles];else ob.lesiones[D.obles]={nota:""};render();return}
  if(D.obrestr){obCollect();const r=ob.dieta.restr;const i=r.indexOf(D.obrestr);if(i>=0)r.splice(i,1);else r.push(D.obrestr);render();return}
  /* sub-pestañas */
  if(D.tview){trainView=D.tview;render();return}
  if(D.fview){foodView=D.fview;render();return}
  if(D.mview){mindView=D.mview;render();return}
  if(D.yview){yoView=D.yview;resetArm=false;render();return}
  if(D.day){selDay=D.day;render();return}
  /* entreno */
  if(D.done){const [id,i]=D.done.split(":");const idx=+i;const ses=curSession(true);const cur=(ses.ex[id]&&ses.ex[id].sets[idx])||{};
    if(cur.done){setInput(id,idx,"done",false);render();return}
    const r=readRow(id,idx);const ex=EXI(id);const p=presc(selDay,id);
    if(!r.reps){toast(ex.type==="time"?"Apunta los segundos":"Apunta las repeticiones");return}
    if((ex.type||"load")==="load"&&r.kg==null){toast("Apunta los kg");return}
    ["kg","reps","rir"].forEach(f=>setInput(id,idx,f,r[f]));setInput(id,idx,"done",true);
    const wasPR=isPR(id,selDate);if(p&&p.rest)startTimer(p.rest,EXI(id).n);
    afterAction(wasPR?"Récord en "+ex.n:null);const okb=$(`[data-done="${id}:${idx}"]`);if(okb&&okb.parentElement)okb.parentElement.classList.add("flash");if(wasPR)confetti(60);return}
  if(D.gate){const chk=$(`[data-auth="${D.gate}"]`);if(!chk||!chk.checked){toast("Marca antes la casilla de autorización");return}
    const sg=suggest(D.gate,selDay,selDate);const ses=curSession(true);const e2=ses.ex[D.gate]||(ses.ex[D.gate]={sets:[]});const n=presc(selDay,D.gate).sets;
    for(let i=0;i<n;i++){e2.sets[i]=e2.sets[i]||{};if(!e2.sets[i].done)e2.sets[i].kg=sg.gate}e2.auth=today();saveSession(ses);render();toast("Subido a "+fmt(sg.gate)+" kg con tu autorización");return}
  if(D.restdone){const d=day(selDate,true);d.activeRest=!d.activeRest;saveDay(selDate);afterAction(d.activeRest?"Descanso activo hecho":null);return}
  if(D.pdel){const [k,i]=D.pdel.split(":");S.plan.days[k].ex.splice(+i,1);S.plan.updated=Date.now();touch("plan");render();return}
  /* comida */
  if(D.water){const d=day(foodDate,true);d.water=Math.max(0,Math.round(((d.water||0)+ +D.water)*100)/100);saveDay(foodDate);afterAction();return}
  if(D.delmeal){const d=day(foodDate);d.meals=d.meals.filter(m=>m.id!==D.delmeal);saveDay(foodDate);render();return}
  if(D.eatplan){const c=S.meta.menu.comidas[+D.eatplan];foodDate=today();addMeal({name:c.plato,kcal:c.kcal,p:c.p,c:c.c,g:c.g,veg:true,momento:c.momento,src:"menu"});toast("Añadido: "+c.plato);return}
  /* mente */
  if(D.breath){breathSel=D.breath;render();return}
  if(D.bmin){breathMin=+D.bmin;render();return}
  if(D.medmin){medMin=+D.medmin;render();return}
  if(D.grp){FR.sel=D.grp;subscribeGroup();render();return}
  if(D.kudo){kudo(D.kudo);return}
  if(D.leave){leaveGroup(D.leave);return}
  if(D.med){startMed(D.med);return}
  if(D.ci){saveCheckin();const [k,v]=D.ci.split(":");const d=day(today(),true);d.checkin=Object.assign(d.checkin||{},{[k]:+v});saveDay(today());render();return}
  const A=D.act;if(!A)return;
  switch(A){
    case "ob-next":{obCollect();obErr=obValidate();if(obErr){render();return}if(obStep>=5){obFinish();return}obStep++;render();window.scrollTo(0,0);return}
    case "ob-back":obCollect();obErr="";obStep--;render();return;
    case "ob-cancel":ob=null;obEdit=false;obStep=0;render();return;
    case "edit-profile":ob=JSON.parse(JSON.stringify(S.profile));ob.dieta=Object.assign(obDefaults().dieta,ob.dieta);ob.lesiones=ob.lesiones||{};obEdit=true;obStep=1;obErr="";render();window.scrollTo(0,0);return;
    case "photo":$("#photoIn").click();return;
    case "text-meal":mealTextOpen=true;pendingPhoto=null;pendingResult=null;render();setTimeout(()=>{const t=$("#mealText");t&&t.focus()},30);return;
    case "cancel-result":if(pendingPhoto)URL.revokeObjectURL(pendingPhoto.url);pendingPhoto=null;pendingResult=null;mealTextOpen=false;render();return;
    case "analyze-photo":case "analyze-text":runAI(A,b);return;
    case "save-result":{const r=pendingResult;const g=id=>num(($(id)||{}).value)||0;
      const m={name:r.nombre||"Comida",kcal:g("#rK"),p:g("#rP"),c:g("#rC"),g:g("#rG"),veg:!!r.verdura,falta:r.falta&&!/^nada/i.test(r.falta)?r.falta:"",momento:($("#rMom")||{}).value,src:r.src||"texto",alimentos:(r.alimentos||[]).slice(0,12)};
      if(pendingPhoto){m.thumb=pendingPhoto.thumb;URL.revokeObjectURL(pendingPhoto.url)}pendingPhoto=null;pendingResult=null;addMeal(m);return}
    case "manual-meal":{const n=($("#mName").value||"").trim();const k=num($("#mK").value);if(!n||k==null){toast("Pon al menos nombre y kcal");return}
      addMeal({name:n,kcal:k,p:num($("#mP").value)||0,c:num($("#mC").value)||0,g:num($("#mG").value)||0,veg:false,momento:guessMoment(),src:"manual"});return}
    case "plan-template":S.plan=templatePlan(S.profile);S.plan.updated=Date.now();touch("plan");trainView="sesion";render();toast("Plan: "+S.plan.nombre);return;
    case "breath":runBreath();return;
    case "ci-save":saveCheckin();afterAction("Check-in guardado");return;
    case "spin":spinWheel();return;
    case "grp-create":createGroup(($("#gName")||{}).value);return;
    case "grp-join":joinGroup(($("#gJoin")||{}).value);return;
    case "copy-code":{const c=FR.sel;const txt="Únete a mi grupo en Gymnarly. Abre la app, ve a Amigos y mete el código "+c;try{navigator.clipboard.writeText(txt).then(()=>toast("Invitación copiada"),()=>toast("Código: "+c))}catch(x){toast("Código: "+c)}return}
    case "roulette-done":{const d=day(today(),true);d.roulette.done=true;saveDay(today());afterAction("Reto hecho: +20 XP");return}
    case "weigh":{const kg=num(($("#wKg")||{}).value);if(!kg||kg<30||kg>300){toast("Pon tu peso en kg");return}S.body[today()]={kg,updated:Date.now()};touch("body");afterAction("Peso guardado");return}
    case "retarget":{const kg=bodyKg();S.profile.peso=Math.round(kg*10)/10;S.profile.targets=computeTargets(S.profile);S.profile.updated=Date.now();touch("profile");render();toast("Objetivos: "+T().kcal+" kcal, "+T().prot+" g de proteína");return}
    case "hide-tip":S.meta.hidePlanTip=true;S.meta.updated=Date.now();touch("meta");render();return;
    case "body-photo":$("#bodyIn").click();return;
    case "body-cancel":if(pendingBody)URL.revokeObjectURL(pendingBody.url);pendingBody=null;render();return;
    case "export":doExport();return;
    case "import":$("#importIn").click();return;
    case "reset":{if(!resetArm){resetArm=true;render();return}const keys=allKeys();S={profile:null,plan:null,body:{},days:{},sessions:{},meta:{}};keys.forEach(k=>dirty.add(k));lsWrite();await flush();resetArm=false;lastGame=null;tab="hoy";render();toast("Datos borrados");return}
  }
});
document.addEventListener("input",e=>{const el=e.target,D=el.dataset;
  if(D.f){const [id,i,f]=D.f.split(":");const v=num(el.value);const st=setInput(id,+i,f,v);return}
  if(D.pe){const [k,i,c]=D.pe.split(":");const v=parseInt(el.value);if(!v||v<1)return;const row=S.plan.days[k].ex[+i];row[+c]=v;if(+c===2&&row[3]<v)row[3]=v;S.plan.updated=Date.now();touch("plan");return}
  if(D.dtitle){S.plan.days[D.dtitle].t=el.value.slice(0,40);S.plan.updated=Date.now();touch("plan");return}
});
document.addEventListener("change",async e=>{const el=e.target,D=el.dataset;
  if(el.id==="selDate"&&el.value){selDate=el.value;selDay=dayKeyOf(selDate);render();return}
  if(el.id==="foodDate"&&el.value){foodDate=el.value;render();return}
  if(el.id==="exSel"){selEx=el.value;render();return}
  if(D.padd&&el.value){const id=el.value;const ex=LIB[id];const row=ex.type==="time"?[id,3,30,60,"—",60]:ex.type==="bw"?[id,3,8,15,"1-2",90]:A(id);S.plan.days[D.padd].ex.push(row);if(S.plan.days[D.padd].t==="Descanso activo")S.plan.days[D.padd].t="Entreno";S.plan.updated=Date.now();touch("plan");render();return}
  if(el.id==="photoIn"&&el.files&&el.files[0]){try{pendingPhoto=await resizeImage(el.files[0]);pendingResult=null;mealTextOpen=false;render()}catch(x){toast("No se pudo abrir la foto")}el.value="";return}
  if(el.id==="bodyIn"&&el.files&&el.files[0]){try{pendingBody=await resizeImage(el.files[0]);render()}catch(x){toast("No se pudo abrir la foto")}el.value="";return}
  if(el.id==="importIn"&&el.files&&el.files[0]){try{const r=JSON.parse(await el.files[0].text());if(!r||!r.profile||!r.profile.targets)throw 0;
      S={profile:r.profile,plan:r.plan||null,body:r.body||{},days:r.days||{},sessions:r.sessions||{},meta:r.meta||{}};allKeys().forEach(k=>dirty.add(k));lsWrite();flush();lastGame=snapshot();render();toast("Copia cargada")}catch(x){toast("Ese archivo no es una copia de Gymnarly")}el.value="";return}
});
