<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Entreno, comida y mente en una sola app. Sin cuentas: tus datos se quedan en tu móvil.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Gymnarly</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymnarly">
<meta name="theme-color" content="#0d0a1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de una columna sobre un fondo nocturno con auroras que cambian de color según la pestaña.
   Tres pilares con color propio (entreno = brasa, comida = mango, mente = lila) que se mezclan en el degradado del XP.
   Superficies de cristal sin bordes duros; navegación flotante con indicador que se desliza. Un solo mundo oscuro, a propósito. */
:root{
  color-scheme:dark;
  --bg:#0d0a1c; --bg2:#151129; --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --stroke:rgba(255,255,255,.08); --stroke2:rgba(255,255,255,.16);
  --fg:#f4f1ff; --muted:#a39fbd; --faint:#6f6a8c;
  --train:#ff6a4d; --food:#ffbf47; --mind:#8f9dff; --xp1:#ff6a4d; --xp2:#ffbf47; --xp3:#8f9dff;
  --up:#59e0a0; --down:#ff5f7a; --warn:#ffbf47; --inj:#c59bff;
  --tint:var(--train); --tint2:var(--mind);
  --grad:linear-gradient(100deg,var(--xp1),var(--xp2) 50%,var(--xp3));
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  /* compatibilidad con nombres antiguos */
  --surface:#1a1530; --surface2:rgba(255,255,255,.07); --line:var(--stroke); --accent:var(--tint); --accent-fg:#160f24; --ember:var(--food);
  --p:var(--train); --c:var(--food); --g:var(--mind);
  --ease:cubic-bezier(.2,.9,.25,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
body[data-tab="hoy"]{--tint:#ff8a5c;--tint2:#8f9dff}
body[data-tab="comida"]{--tint:var(--food);--tint2:#ff6a4d}
body[data-tab="entreno"]{--tint:var(--train);--tint2:#ffbf47}
body[data-tab="mente"]{--tint:var(--mind);--tint2:#59e0d0}
body[data-tab="yo"]{--tint:#ffbf47;--tint2:#c59bff}
body[data-tab="amigos"]{--tint:#59e0a0;--tint2:#8f9dff}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;min-height:100%;overflow-x:hidden}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* aurora */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.33;transition:background 1.2s ease}
.aurora i:nth-child(1){background:radial-gradient(circle,var(--tint),transparent 62%);top:-35vmax;left:-25vmax}
.aurora i:nth-child(2){background:radial-gradient(circle,var(--tint2),transparent 62%);bottom:-40vmax;right:-30vmax;opacity:.24}
.aurora i:nth-child(3){background:radial-gradient(circle,#3b2a8a,transparent 60%);top:30%;left:40%;width:50vmax;height:50vmax;opacity:.35}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05;background-image:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1px);background-size:3px 3px}
@media (prefers-reduced-motion:no-preference){
  .aurora i:nth-child(1){animation:drift1 22s ease-in-out infinite alternate}
  .aurora i:nth-child(2){animation:drift2 26s ease-in-out infinite alternate}
  .aurora i:nth-child(3){animation:drift1 30s ease-in-out infinite alternate-reverse}
  @keyframes drift1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-14vmax,-16vmax) scale(1.1)}}
}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:10px 170px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{font:800 19px var(--display);letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px}
.brand .wm span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand svg{width:26px;height:26px}
h1{font:800 clamp(30px,8.5vw,44px)/1.02 var(--display);letter-spacing:-.035em;margin:0;text-wrap:balance}
h2{font:700 22px/1.15 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
h3{font:700 16px/1.25 var(--display);margin:0;letter-spacing:-.01em}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.eyebrow{font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
#view{display:flex;flex-direction:column;gap:16px;margin-top:8px}
/* superficies */
.card{position:relative;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1px solid var(--stroke);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 20px 40px -24px rgba(0,0,0,.6)}
.card.game{background:linear-gradient(160deg,rgba(255,191,71,.12),rgba(255,106,77,.05) 50%,rgba(143,157,255,.06))}
.card.flat{background:none;border:0;box-shadow:none;padding:4px 2px;-webkit-backdrop-filter:none;backdrop-filter:none}
details.card{display:block}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 2px 0}
/* chips y segmentos */
.chips{display:flex;gap:6px;overflow-x:auto;padding:3px;scrollbar-width:none;flex-wrap:nowrap;margin:0 -3px}
.chips::-webkit-scrollbar{display:none}
.chips.wrapc{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--stroke);background:var(--glass);color:var(--fg);border-radius:999px;padding:9px 15px;font:600 14px var(--body);white-space:nowrap;cursor:pointer;transition:background .25s,color .25s,transform .2s var(--spring),border-color .25s}
.chip[aria-pressed="true"]{background:var(--fg);color:#140f24;border-color:var(--fg)}
.chip.optc{display:flex;flex-direction:column;align-items:flex-start;white-space:normal;text-align:left}
.seg{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.05);border-radius:999px;position:relative;width:fit-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg .chip{border:0;background:transparent;color:var(--muted);padding:8px 14px}
.seg .chip[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--fg)}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--glass2);color:var(--muted)}
.tag.inj{background:rgba(197,155,255,.16);color:var(--inj)} .tag.xp{background:rgba(255,191,71,.15);color:var(--food)}
/* formularios */
input,select,textarea{font:500 16px var(--body);color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--stroke);border-radius:14px;padding:12px;width:100%;min-width:0;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--stroke2);background:rgba(255,255,255,.09);outline:none}
select option{background:#1a1530;color:var(--fg)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;padding:0;accent-color:var(--up);flex:0 0 auto}
input[type=date]{color-scheme:dark}
input.cell{text-align:center;font:600 17px var(--mono);font-variant-numeric:tabular-nums;padding:11px 4px}
input.cell::placeholder{font:500 13px var(--body);color:var(--faint)}
::placeholder{color:var(--faint)}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0;flex:1}
label.chk{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px;color:var(--fg)}
:focus-visible{outline:2px solid var(--food);outline-offset:3px}
/* botones */
button{font:600 15px var(--body);cursor:pointer;border-radius:999px;border:1px solid var(--stroke);background:var(--glass2);color:var(--fg);padding:11px 16px;transition:transform .18s var(--spring),background .2s,opacity .2s;position:relative;overflow:hidden}
button:active:not(:disabled){transform:scale(.95)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--fg);color:#140f24;border-color:transparent}
button.ember,button.hot{background:var(--grad);color:#1a0f12;border-color:transparent;font-weight:700}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.big{padding:16px 18px;font-size:16px;width:100%}
button.small{padding:7px 12px;font-size:13px}
button .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:rgba(255,255,255,.05);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font:700 22px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .l{font-size:12px;color:var(--muted)}
.bar{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;position:relative}
.bar>span{display:block;height:100%;background:var(--tint);border-radius:99px;transition:width 1s var(--ease)}
.bar.ember>span,.bar.xp>span{background:var(--grad);background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.bar.xp>span{animation:shimmer 3s linear infinite}@keyframes shimmer{to{background-position:-200% 0}}}
.sug{border-radius:18px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:3px;background:rgba(255,255,255,.06);border-left:3px solid var(--muted)}
.sug b{font:700 15px var(--display);letter-spacing:-.01em}
.sug.up{border-color:var(--up);background:rgba(89,224,160,.09)} .sug.up b{color:var(--up)}
.sug.keep{border-color:var(--food)} .sug.down{border-color:var(--down);background:rgba(255,95,122,.09)} .sug.down b{color:var(--down)}
.sug.inj{border-color:var(--inj);background:rgba(197,155,255,.1)} .sug.inj b{color:var(--inj)} .sug.info{border-color:var(--mind)}
.sug .why{color:var(--muted);font-size:13px}
.banner{border-radius:20px;padding:14px;background:rgba(197,155,255,.1);border:1px solid rgba(197,155,255,.3);display:flex;flex-direction:column;gap:6px;font-size:14px}
.banner h3{color:var(--inj)}
.lfr{display:flex!important;flex-direction:column;align-items:flex-start!important;gap:2px;text-align:left;width:100%;padding:10px 14px}.lfr b{font-weight:600}
.aviso{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--muted);margin:12px 0 0;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12)}
.aviso svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;margin-top:1px}
.card>.aviso:last-child{margin-bottom:0}
.note{font-size:13px;color:var(--muted);background:rgba(255,255,255,.04);border-radius:16px;padding:11px 13px}
.ai{white-space:pre-wrap;font-size:14.5px;line-height:1.6}
.ai:empty{display:none}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--stroke2);border-radius:20px}
/* entreno */
.sets{display:flex;flex-direction:column;gap:7px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 58px 46px;gap:6px;align-items:center;border-radius:16px;transition:background .3s}
.set .n{font:700 13px var(--mono);color:var(--faint);text-align:center}
.set.done .n{color:var(--up)}
.set.done input.cell{border-color:rgba(89,224,160,.35);background:rgba(89,224,160,.08)}
.colh{display:grid;grid-template-columns:30px 1fr 1fr 58px 46px;gap:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:center}
button.ok{width:46px;height:46px;padding:0;font-size:18px;display:grid;place-items:center;border-radius:15px}
.set.done button.ok{background:var(--up);border-color:var(--up);color:#0b2618}
@media (prefers-reduced-motion:no-preference){.set.flash{animation:flash .9s var(--ease)}@keyframes flash{0%{background:rgba(89,224,160,.35)}100%{background:transparent}}
 .set.flash button.ok{animation:okpop .5s var(--spring)}@keyframes okpop{0%{transform:scale(.6)}100%{transform:none}}}
.presc{font:500 12.5px var(--mono);color:var(--muted)}
.cue{font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--stroke);padding-top:10px}
details.card,details.clean{border-top:1px solid var(--stroke)}
summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font:700 15px var(--mono);color:var(--faint);transition:transform .25s}
details[open] summary::before{transform:rotate(45deg)}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.ex-n{font:800 13px var(--display);width:34px;height:34px;flex:0 0 34px;border-radius:12px;display:grid;place-items:center;background:rgba(255,106,77,.16);color:var(--train)}
.ex-done .ex-n{background:var(--up);color:#0b2618}
/* comida */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.ring{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ring svg{width:100%;max-width:84px;height:auto}
.ring .l{font-size:12px;color:var(--muted)}
.ring .arc{transition:stroke-dasharray 1.2s var(--ease)}
.meal{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--stroke)}
.meal:last-child{border-bottom:0}
.thumb{width:56px;height:56px;border-radius:18px;background:rgba(255,191,71,.12);object-fit:cover;display:grid;place-items:center;font:700 11px var(--display);color:var(--food);text-transform:uppercase}
.macros{font:500 12px var(--mono);color:var(--muted)}
.photo-prev{width:100%;max-height:320px;object-fit:cover;border-radius:22px}
.cam{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.cam button{border-radius:24px;padding:18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;min-height:118px;justify-content:space-between}
.cam button svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cam .shoot{background:linear-gradient(140deg,#ffcf6b,#ff7a4d);color:#2a1208;border:0}
.scan{position:relative;overflow:hidden;border-radius:22px}
.scan::after{content:"";position:absolute;left:0;right:0;height:40%;background:linear-gradient(180deg,transparent,rgba(255,191,71,.45),transparent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{from{top:-40%}to{top:100%}}
/* mente */
.breath{display:grid;place-items:center;padding:18px 0;position:relative}
.orb{position:relative;width:min(240px,64vw);aspect-ratio:1;display:grid;place-items:center}
.orb .o{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9deff,var(--mind) 45%,#4b3fd0 80%);box-shadow:0 0 80px 10px rgba(143,157,255,.45);transform:scale(.55);transition-property:transform;transition-timing-function:cubic-bezier(.45,0,.55,1)}
.orb .r{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(143,157,255,.35)}
@media (prefers-reduced-motion:no-preference){.orb .r{animation:ripple 4s ease-out infinite}.orb .r:nth-child(2){animation-delay:1.3s}.orb .r:nth-child(3){animation-delay:2.6s}
 @keyframes ripple{from{transform:scale(.55);opacity:.9}to{transform:scale(1.35);opacity:0}}}
.orb span{position:relative;font:700 17px var(--display);color:#160f3a;letter-spacing:.02em;text-transform:uppercase}
.circle{display:none}
.guide{font:500 21px/1.45 var(--body);min-height:130px;text-align:center;padding:10px;text-wrap:balance;transition:opacity .6s}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{padding:12px 0;font:700 17px var(--display);border-radius:16px}
.scale button[aria-pressed="true"]{background:var(--fg);color:#140f24}
.medlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.med{border-radius:24px;padding:16px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;border:0;background:linear-gradient(150deg,var(--c1),var(--c2));color:#140f24}
.med b{font:800 15px/1.2 var(--display)} .med span{font-size:12.5px;opacity:.8}
.med svg{width:30px;height:30px;stroke:#140f24;fill:none;stroke-width:1.8;stroke-linecap:round}
/* sesión inmersiva */
.zen{position:fixed;inset:0;z-index:60;background:radial-gradient(ellipse at 50% 30%,#2b2470,#0d0a1c 70%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));gap:18px;text-align:center}
.zen .top{width:100%;display:flex;justify-content:space-between;align-items:center}
.zen .mid{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:520px}
.zen .time{font:700 15px var(--mono);color:var(--muted)}
.zen .ctrl{display:flex;gap:10px;justify-content:center}
.zen .prog{width:100%;max-width:520px}
@media (prefers-reduced-motion:no-preference){.zen{animation:zenin .6s var(--ease)}@keyframes zenin{from{opacity:0;transform:scale(1.04)}}}
.stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5}
@media (prefers-reduced-motion:no-preference){.stars i{animation:tw 3s ease-in-out infinite alternate}@keyframes tw{to{opacity:.05}}}
/* juego */
.dayring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:4px auto 0}
.dayring svg{width:100%;height:100%;overflow:visible}
.dayring .arc{transition:stroke-dashoffset 1.4s var(--ease)}
.dayring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dayring .lv{font:800 64px/1 var(--display);letter-spacing:-.05em}
.legend{display:flex;flex-direction:column;gap:2px}
.q{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--stroke)}
.q:last-child{border-bottom:0}
.q .d{width:12px;height:12px;border-radius:50%;background:var(--qc);box-shadow:0 0 12px var(--qc)}
.q.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--qc)}
.q .chk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--qc);color:#140f24;font-weight:800}
.lvl{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.lvlbadge{width:56px;height:56px;border-radius:18px;background:var(--grad);color:#1a0f12;display:grid;place-items:center;font:800 24px var(--display)}
.streak{display:flex;align-items:center;gap:8px}
.streak svg{width:26px;height:26px}
@media (prefers-reduced-motion:no-preference){.streak.on svg{animation:flame 1.2s ease-in-out infinite alternate;transform-origin:50% 90%}@keyframes flame{to{transform:scale(1.12) rotate(-4deg)}}}
.quest{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.boss{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
@media (prefers-reduced-motion:no-preference){.boss .bsvg{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}

<script>window.GYM_LOCAL=1</script>
<script>
/* ================= UTILIDADES ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n};
const fmt=(n,d=1)=>n==null||isNaN(n)?"–":(Math.round(n*10**d)/10**d).toLocaleString("es-ES");
const fmt0=n=>n==null?"":String(n).replace(".",",");
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addDays=(ds,n)=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const dmy=s=>{const [y,m,d]=s.split("-");return +d+"/"+ +m};
const DAYKEYS=["dom","lun","mar","mie","jue","vie","sab"];
const DAYNAMES={lun:"Lunes",mar:"Martes",mie:"Miércoles",jue:"Jueves",vie:"Viernes",sab:"Sábado",dom:"Domingo"};
const WEEK=["lun","mar","mie","jue","vie","sab","dom"];
const dayKeyOf=ds=>DAYKEYS[new Date(ds+"T12:00:00").getDay()];
const weekStart=ds=>{const d=new Date(ds+"T12:00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const roundStep=x=>Math.round(x*100)/100;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function toast(msg,ms=2600){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ================= DATOS Y GUARDADO =================
   Cada persona tiene su espacio privado: data/users/<id>/ con documentos
   profile, plan, body, d-AAAA-MM-DD (comidas, agua, mente), s-<fecha>-<día> (entrenos). */
const LS_KEY="gymnarly-v1";
let S={profile:null,plan:null,body:{},days:{},sessions:{},meta:{}};
let COL=null,dirty=new Set(),saveTimer=null,syncMode="local";
function lsRead(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsWrite(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function touch(key){dirty.add(key);lsWrite();clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
function docFor(key){
  if(key==="profile")return S.profile; if(key==="plan")return S.plan; if(key==="meta")return S.meta;
  if(key==="body")return {entries:S.body};
  if(key.startsWith("d-"))return S.days[key.slice(2)];
  if(key.startsWith("s-"))return S.sessions[key.slice(2)];
}
async function flush(){
  if(!COL){dirty.clear();return}
  const keys=[...dirty];dirty.clear();
  for(const k of keys){
    try{const v=docFor(k);
      if(v)await COL.doc(k).set(JSON.parse(JSON.stringify(Object.assign({},v,{updated:v.updated||Date.now()}))));
      else await COL.doc(k).delete();
      setSync("ok");
    }catch(e){dirty.add(k);setSync("err",e&&e.code);
      if(e&&e.code==="quota_exceeded")toast("Sin espacio en la nube: exporta tus datos en Logros → Datos.");}
  }
}
function setSync(m,code){syncMode=m;const d=$("#syncDot"),t=$("#syncTxt");if(!d)return;
  d.className="dot "+(m==="ok"?"ok":"local");
  t.textContent=m==="ok"?"Guardado en tu cuenta":m==="err"?"Error al guardar ("+(code||"red")+")":"Solo en este dispositivo";}
let AI=null, AI_IMG=false, USER=null;
const LOCAL=!!window.GYM_LOCAL;
const AVISOS={
 comida:"Orientación aproximada. Para un plan ajustado a ti, o si tienes alguna enfermedad o alergia, consulta a un dietista-nutricionista colegiado.",
 lesion:"Indicaciones sugeridas, no un diagnóstico. Si tienes dolor o una lesión, lo mejor es que te valore un fisioterapeuta o un médico.",
 entreno:"Plan orientativo. Si tienes alguna enfermedad, una lesión o hace tiempo que no haces ejercicio, consulta antes con tu médico.",
 mente:"Gymnarly no sustituye a un psicólogo. Si llevas semanas mal, habla con un profesional. En España, el 024 es gratuito y atiende las 24 horas.",
 cuerpo:"Estimación orientativa con mucho margen de error. Para medir tu composición corporal, acude a un dietista-nutricionista o a un médico."};
function aviso(k){return `<p class="aviso"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg><span>${AVISOS[k]}</span></p>`}
async function initStore(){
  const local=lsRead();if(local)S=Object.assign(S,local);
  render();
  if(!window.claude||!window.claude.use){setSync("local");return}
  window.claude.use("sample").then(async s=>{AI=s;if(s){try{const l=await s.limits();AI_IMG=!!(l&&l.images)}catch(e){}}render()}).catch(()=>{});
  try{
    const db=await window.claude.use("db");USER=await window.claude.use("user");
    if(!db||!USER){setSync("local");return}
    const id=await USER.id();if(!id){setSync("local");return}
    COL=db.collection("data/users/"+id);
    const snap=await COL.get();
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;const r=JSON.parse(JSON.stringify(v));
      const key=d.id;
      const cur=docFor(key);
      const newer=!cur||(r.updated||0)>=(cur.updated||0);
      if(key==="profile"&&newer)S.profile=r;
      else if(key==="plan"&&newer)S.plan=r;
      else if(key==="meta"&&newer)S.meta=r;
      else if(key==="body")S.body=Object.assign({},S.body,r.entries||{});
      else if(key.startsWith("d-")&&newer)S.days[key.slice(2)]=r;
      else if(key.startsWith("s-")&&newer)S.sessions[key.slice(2)]=r;});
    // lo que solo existe en este dispositivo se sube
    const remote=new Set(snap.docs.map(d=>d.id));
    ["profile","plan","meta"].forEach(k=>{if(docFor(k)&&!remote.has(k))dirty.add(k)});
    Object.keys(S.days).forEach(k=>{if(!remote.has("d-"+k))dirty.add("d-"+k)});
    Object.keys(S.sessions).forEach(k=>{if(!remote.has("s-"+k))dirty.add("s-"+k)});
    if(Object.keys(S.body).length)dirty.add("body");
    setSync("ok");lsWrite();render();flush();
  }catch(e){setSync("local")}
}
function day(ds,create){if(!S.days[ds]&&create)S.days[ds]={date:ds,meals:[],water:0,mind:{min:0,log:[]},checkin:null};return S.days[ds]}
function saveDay(ds){const d=S.days[ds];if(d){d.updated=Date.now();touch("d-"+ds)}}

/* ================= PERFIL Y OBJETIVOS =================
   Gasto: Mifflin-St Jeor × factor de actividad (la fórmula con mejor precisión media en adultos; error típico ±10 %).
   Proteína: 1,6-2,2 g/kg es el rango con mejor evidencia para ganar o conservar músculo; usamos 1,8 g/kg sobre el
   peso de referencia (el menor entre tu peso y el peso con IMC 25), porque con exceso de grasa el peso total infla la cifra. */
const ACT={sed:{n:"Sedentario (sentado casi todo el día)",f:1.2},lig:{n:"Ligero (5.000-8.000 pasos)",f:1.375},mod:{n:"Moderado (8.000-12.000 pasos o trabajo de pie)",f:1.55},alto:{n:"Alto (más de 12.000 pasos o trabajo físico)",f:1.725}};
const GOALS={grasa:{n:"Perder grasa",d:"Déficit moderado conservando músculo"},musculo:{n:"Ganar músculo",d:"Ligero superávit y progresión de cargas"},recomp:{n:"Recomposición",d:"Comer a mantenimiento y entrenar duro"},salud:{n:"Salud y energía",d:"Hábitos, fuerza básica y comer bien"}};
const ZONES={rodilla:"Rodilla",hombro:"Hombro",lumbar:"Espalda baja",codo:"Codo o muñeca",tobillo:"Tobillo",cadera:"Cadera"};
function computeTargets(p){
  const w=p.peso,h=p.altura,a=p.edad;
  const bmr=10*w+6.25*h-5*a+(p.sexo==="m"?5:-161);
  const tdee=bmr*(ACT[p.actividad]||ACT.mod).f+(p.diasEntreno||3)*(p.minutos||60)*5/7; // ~5 kcal/min de pesas repartido en la semana
  let adj=0;
  if(p.objetivo==="grasa")adj=a<18?-0.12:-0.2;
  if(p.objetivo==="musculo")adj=0.08;
  let kcal=Math.round(tdee*(1+adj)/50)*50;
  kcal=Math.max(kcal,Math.round(bmr*1.1/50)*50); // nunca por debajo del metabolismo basal +10 %
  const refW=Math.min(w,25*(h/100)**2);
  const prot=Math.round(refW*(p.objetivo==="salud"?1.6:1.8)/5)*5;
  const fat=Math.max(Math.round(kcal*0.27/9),Math.round(refW*0.7));
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const fibra=Math.round(kcal/1000*14);
  const agua=Math.round((w*0.035+0.5)*10)/10;
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carb,fibra,agua,refW:Math.round(refW)};
}

function templatePlan(p){

  const days={};
  WEEK.forEach(k=>{days[k]={t:"Descanso activo",ex:[]}});
  for(const [k,b] of Object.entries(sp.d)){
    const ex=[];const seen=new Set();
    BLOCKS[b].ex.forEach(r=>{const id=adapt(r[0],eq);if(!id||seen.has(id))return;seen.add(id);
      const row=r.slice();row[0]=id;
      if(novice&&row[4]!=="—")row[4]="2-3";
      if((p.minutos||60)<=45&&ex.length>=5)return;

  }
  return {nombre:sp.n,origen:"plantilla",days,creado:today()};

/* ================= ENTRENO: historial y progresión ================= */
function EXI(id){return LIB[id]||(S.plan&&S.plan.custom&&S.plan.custom[id])||{n:id,g:"otro",step:2.5}}
function PDAYS(){return (S.plan&&S.plan.days)||{}}
function presc(dk,id){const d=PDAYS()[dk];const e=d&&d.ex.find(x=>x[0]===id);return e?{id:e[0],sets:e[1],lo:e[2],hi:e[3],rir:e[4],rest:e[5]}:null}
const isLogged=st=>st&&st.done;
function historyFor(id,before){
  return Object.values(S.sessions).filter(x=>x.ex&&x.ex[id]&&(x.ex[id].sets||[]).some(isLogged)&&(!before||x.date<before))
   .sort((a,b)=>a.date<b.date?1:-1).map(x=>({date:x.date,sets:x.ex[id].sets.filter(isLogged)}));
}
const e1rm=(kg,r)=>kg!=null&&r?kg*(1+r/30):null;
function metric(ex,sets){ // número que resume una sesión: 1RM estimado (Epley), reps de la mejor serie o segundos
  if(ex.type==="bw")return Math.max(0,...sets.map(s=>s.reps||0))||null;
  if(ex.type==="time")return Math.max(0,...sets.map(s=>s.reps||0))||null;
  return Math.max(0,...sets.filter(s=>s.reps&&s.reps<=15).map(s=>e1rm(s.kg,s.reps)||0))||null;
}
function zoneHit(ex){const inj=injured();return (ex.z||[]).filter(z=>inj.includes(z))}
/* Doble progresión: primero repeticiones dentro del rango; cuando TODAS las series llegan al tope sin RIR 0, sube carga. */
function suggest(id,dk,date){
  const ex=EXI(id),p=presc(dk,id);if(!p)return null;
  const hist=historyFor(id,date);const zh=zoneHit(ex);
  if(ex.type==="time"){const l=hist[0];return {lvl:"info",head:l?"Supera "+Math.max(...l.sets.map(s=>s.reps||0))+" s":"Aguanta "+p.lo+"-"+p.hi+" s",why:"Cuando hagas "+p.hi+" s en todas, pasa a una variante más difícil."}}
  if(ex.type==="bw"){const l=hist[0];const best=l?Math.max(...l.sets.map(s=>s.reps||0)):null;
    if(!l)return {lvl:"info",head:p.lo+"-"+p.hi+" reps",why:"Primera vez: apunta cuántas salen dejando "+p.rir+" en reserva."};
    if(l.sets.every(s=>(s.reps||0)>=p.hi))return {lvl:zh.length?"inj":"up",head:"Haz la variante más difícil o añade peso",why:"Hiciste "+p.hi+"+ en todas las series ("+l.sets.map(s=>s.reps).join(", ")+")."+(zh.length?" Tienes lesión en "+zh.map(z=>ZONES[z].toLowerCase()).join(" y ")+": confirma antes con tu fisio o médico.":"")};
    return {lvl:"keep",head:"Busca "+(best+1)+" reps en la mejor serie",why:"La última vez: "+l.sets.map(s=>s.reps).join(", ")+"."}}
  if(!hist.length)return {lvl:"info",head:"Primera vez: busca tu peso",why:"Elige un peso con el que hagas "+p.hi+" repeticiones dejando "+p.rir+" en reserva. Apúntalo y la próxima vez te diré qué poner.",kg:null};
  const last=hist[0].sets.filter(s=>s.reps!=null&&s.kg!=null);
  if(!last.length)return {lvl:"info",head:"Sin datos completos la última vez",why:"Apunta kg y reps de cada serie.",kg:null};
  const kgs=[...new Set(last.map(s=>s.kg))].sort((a,b)=>b-a);
  let W=kgs.find(k=>last.filter(s=>s.kg===k).every(s=>s.reps>=p.lo));if(W==null)W=kgs[kgs.length-1];
  const lw=last.filter(s=>s.kg===W);const reps=last.map(s=>s.reps).join(", ");
  const mix=kgs.length>1?" Cambiaste de peso dentro del ejercicio: hoy el mismo en todas las series.":"";
  const top=lw.length>=Math.min(p.sets,last.length)&&lw.every(s=>s.reps>=p.hi&&(s.rir==null||s.rir>=1));
  const below=lw.some(s=>s.reps<p.lo);
  const step=ex.step||2.5,next=roundStep(W+step),jump=step/W;
  if(top){
    if(zh.length)return {kg:W,lvl:"inj",head:"Cumples el criterio para subir · mantén "+fmt(W)+" kg",why:"Hiciste "+reps+" con "+fmt(W)+" kg. Este ejercicio carga tu "+zh.map(z=>ZONES[z].toLowerCase()).join(" y ")+" lesionada: la app no sube sola. Si tu fisio o médico lo autoriza, pulsa el botón.",gate:next};
    if(jump>0.10&&!lw.every(s=>s.reps>=p.hi+3))return {kg:W,lvl:"keep",head:fmt(W)+" kg · busca "+(p.hi+1)+"-"+(p.hi+3)+" reps",why:"Subir a "+fmt(next)+" kg sería +"+Math.round(jump*100)+" % de golpe. Antes alarga 3 reps; los saltos grandes son los que más se fallan y más lesionan."+mix};
    return {kg:next,lvl:"up",head:"Sube a "+fmt(next)+" kg",why:"Llegaste al tope ("+p.hi+") en todas: "+reps+" con "+fmt(W)+" kg. Hoy vale con "+p.lo+"+ en todas."+mix};
  }
  if(below){const prev=hist[1]?hist[1].sets.filter(s=>s.kg===W&&s.reps!=null):[];const down=roundStep(W-step);
    if(prev.length&&prev.some(s=>s.reps<p.lo)&&down>0&&step/W<=0.15)return {kg:down,lvl:"down",head:"Baja a "+fmt(down)+" kg",why:"Dos sesiones seguidas por debajo de "+p.lo+" reps. Baja, haz el rango completo y vuelve a subir."+mix};
    return {kg:W,lvl:"keep",head:"Mantén "+fmt(W)+" kg",why:"La última vez: "+reps+". Objetivo: "+p.lo+" o más en todas antes de tocar el peso."+mix}}
  const mn=Math.min(...lw.map(s=>s.reps));
  return {kg:W,lvl:"keep",head:"Mantén "+fmt(W)+" kg · +1 rep",why:"La última vez: "+reps+". Saca 1 más en la serie más floja ("+mn+"→"+(mn+1)+"). Subes cuando hagas "+p.hi+" en todas."+mix};
}
function isPR(id,date){const ex=EXI(id);const ses=Object.values(S.sessions).find(x=>x.date===date&&x.ex&&x.ex[id]);if(!ses)return false;
  const cur=metric(ex,ses.ex[id].sets.filter(isLogged));if(!cur)return false;const prev=historyFor(id,date);if(!prev.length)return false;
  return cur>Math.max(...prev.map(h=>metric(ex,h.sets)||0))}

let TM={end:0,total:0,lbl:"",iv:null,beeped:false},AC=null,wake=null;
function audio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function beep(n=3,f=880){try{if(!AC)return;for(let i=0;i<n;i++){const t=i*0.25,o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0.22,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+t+0.18);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+0.2)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
async function keepAwake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null})}}catch(e){}}
function startTimer(sec,lbl){audio();keepAwake();TM.end=Date.now()+sec*1000;TM.total=sec;TM.lbl=lbl;TM.beeped=false;$("#timer").hidden=false;$("#timer").classList.remove("over");clearInterval(TM.iv);TM.iv=setInterval(tick,250);tick()}
function tick(){const left=Math.round((TM.end-Date.now())/1000),a=Math.abs(left);$("#tLeft").textContent=(left<0?"+":"")+Math.floor(a/60)+":"+String(a%60).padStart(2,"0");$("#tLbl").textContent=left<=0?"A por la siguiente serie":TM.lbl;$("#tBar").style.width=clamp(100*left/TM.total,0,100)+"%";if(left<=0&&!TM.beeped){TM.beeped=true;beep();$("#timer").classList.add("over")}}
$("#tPlus").onclick=()=>{TM.end+=15000;TM.total+=15;TM.beeped=false;$("#timer").classList.remove("over");tick()};
$("#tMinus").onclick=()=>{TM.end-=15000;tick()};
$("#tStop").onclick=()=>{clearInterval(TM.iv);$("#timer").hidden=true};

function curSession(create){const id=sessionId();if(!S.sessions[id]&&create)S.sessions[id]={id,date:selDate,day:selDay,ex:{}};return S.sessions[id]}
function saveSession(ses){ses.updated=Date.now();touch("s-"+ses.id)}
function viewEntreno(){
  if(!S.plan)return planCreator();
  let h=`<div class="seg" role="tablist">${[["sesion","Sesión"],["progreso","Progreso"],["plan","Mi plan"]].map(([k,n])=>`<button class="chip" data-tview="${k}" aria-pressed="${trainView===k}">${n}</button>`).join("")}</div>`;
  if(trainView==="progreso")return h+viewProgreso();
  if(trainView==="plan")return h+viewPlanEditor();
  const D=PDAYS()[selDay]||{t:"Descanso",ex:[]};
  h+=`<div class="seg" role="group" aria-label="Día">${WEEK.map(k=>`<button class="chip" data-day="${k}" aria-pressed="${k===selDay}">${DAYNAMES[k].slice(0,3)}</button>`).join("")}</div>
  <div class="row between" style="align-items:flex-end"><div><p class="eyebrow">${DAYNAMES[selDay]} · ${dmy(selDate)}</p><h1>${esc(D.t)}</h1></div><label class="f" style="flex:0 0 150px">Fecha<input type="date" id="selDate" value="${selDate}"></label></div>`;
  if(!D.ex.length)return h+`<div class="card"><h3>Hoy toca descansar</h3><p class="muted">El músculo crece mientras recuperas. Si te apetece moverte: 20-30 minutos andando, en bici o nadando suave, y 10 minutos de movilidad. Cuenta para la misión del día si lo marcas.</p>${restDoneBtn()}</div>`;
  const inj=injured();
  if(inj.length&&D.ex.some(e=>zoneHit(EXI(e[0])).length))h+=`<div class="banner"><h3>Lesión: ${inj.map(z=>ZONES[z]).join(", ")}</h3><div>Los ejercicios marcados cargan esa zona. Haz solo lo que te haya autorizado tu fisio o médico; la app no sube peso en ellos por su cuenta. Si duele más de 3 sobre 10 durante un ejercicio, para.</div>${aviso("lesion")}</div>`;
  D.ex.forEach((e,i)=>h+=exCard(e[0],i));
  h+=sessionSummary(D);
  return h;
}
function restDoneBtn(){const d=day(selDate);const done=d&&d.activeRest;return `<button class="${done?"":"primary"}" data-restdone="1">${done?"Hecho ✓ (pulsa para quitar)":"He hecho mi descanso activo"}</button>`}
function exCard(id,idx){
  const ex=EXI(id),p=presc(selDay,id);if(!p)return "";
  const ses=curSession(false);const logged=ses&&ses.ex[id]?ses.ex[id].sets:[];
  const sg=suggest(id,selDay,selDate);const zh=zoneHit(ex);
  const n=Math.max(p.sets,logged.length);const kind=ex.type||"load";
  let h=`<section class="card" data-ex="${id}"><div class="ex-h ${logged.length&&logged.filter(s=>s.done).length>=p.sets?"ex-done":""}"><span class="ex-n">${logged.length&&logged.filter(s=>s.done).length>=p.sets?"✓":idx+1}</span><div class="stack" style="gap:4px;min-width:0;flex:1"><h3>${esc(ex.n)}</h3><div class="row" style="gap:6px">${zh.length?`<span class="tag inj">${esc(zh.map(z=>ZONES[z]).join(" · "))}</span>`:""}<span class="tag">${esc(ex.g)}</span></div></div></div>
   <div class="presc">${p.sets} × ${p.lo===p.hi?p.lo:p.lo+"-"+p.hi}${kind==="time"?" s":""} · RIR ${esc(p.rir)} · descanso ${Math.floor(p.rest/60)}:${String(p.rest%60).padStart(2,"0")}${ex.unit?" · "+esc(ex.unit):""}</div>`;
  if(sg)h+=`<div class="sug ${sg.lvl}"><b>${esc(sg.head)}</b><span class="why">${esc(sg.why)}</span>${sg.gate?`<label class="chk small" style="margin-top:6px"><input type="checkbox" data-auth="${id}"><span>Mi fisio o médico me ha autorizado a subir carga aquí</span></label><button data-gate="${id}" style="margin-top:4px">Subir a ${fmt(sg.gate)} kg</button>`:""}</div>`;
  h+=`<div class="cue">${esc(ex.cue||"")}</div>`;
  h+=`<div class="colh"><span></span><span>${kind==="load"?"kg":""}</span><span>${kind==="time"?"seg":"reps"}</span><span>RIR</span><span></span></div><div class="sets">`;
  for(let i=0;i<n;i++){const st=logged[i]||{};
    h+=`<div class="set ${st.done?"done":""}"><span class="n">S${i+1}</span>${kind==="load"?`<input class="cell" inputmode="decimal" data-f="${id}:${i}:kg" value="${st.kg!=null?fmt0(st.kg):fmt0(sg&&sg.kg)}" placeholder="kg" aria-label="kg serie ${i+1}">`:`<span class="small muted" style="text-align:center">${kind==="time"?"segundos":"sin carga"}</span>`}
      <input class="cell" inputmode="numeric" data-f="${id}:${i}:reps" value="${st.reps??""}" placeholder="${p.lo===p.hi?p.lo:p.lo+"-"+p.hi}" aria-label="repeticiones serie ${i+1}">
      <input class="cell" inputmode="numeric" data-f="${id}:${i}:rir" value="${st.rir??""}" placeholder="${esc(p.rir)}" aria-label="RIR serie ${i+1}">
      <button class="ok" data-done="${id}:${i}" aria-label="Serie ${i+1} hecha">✓</button></div>`}
  h+=`</div><details><summary>Qué es el RIR y última vez</summary><div class="stack small" style="margin-top:8px"><p class="muted">RIR = repeticiones que te quedaban en el depósito. RIR 2: podrías haber hecho 2 más con buena técnica. Ir siempre al fallo (RIR 0) no da más músculo y cansa más.</p>${(()=>{const l=historyFor(id,selDate)[0];return l?`<p>${dmy(l.date)}: ${l.sets.map(s=>(kind==="load"?fmt(s.kg)+" kg × ":"")+s.reps+(s.rir!=null?" (RIR "+s.rir+")":"")).join(" · ")}</p>`:"<p>Sin registros anteriores.</p>"})()}</div></details></section>`;
  return h;
}
function sessionSummary(D){
  const ses=curSession(false);const total=D.ex.reduce((a,e)=>a+e[1],0);let done=0,ton=0;
  if(ses)Object.values(ses.ex).forEach(v=>(v.sets||[]).forEach(s=>{if(s.done){done++;if(s.kg&&s.reps)ton+=s.kg*s.reps}}));
  const prs=ses?Object.keys(ses.ex).filter(id=>isPR(id,selDate)):[];
  return `<div class="card"><h3>Resumen de la sesión</h3><div class="grid3"><div class="stat"><span class="v">${done}/${total}</span><span class="l">series</span></div><div class="stat"><span class="v">${Math.round(ton).toLocaleString("es-ES")}</span><span class="l">kg movidos</span></div><div class="stat"><span class="v">${prs.length}</span><span class="l">récords</span></div></div>
  ${prs.length?`<p class="small">Récords hoy: ${prs.map(id=>esc(EXI(id).n)).join(", ")}.</p>`:""}
  <p class="small muted">Se guarda solo al escribir. Las sugerencias de la próxima sesión salen de las reps y el RIR reales que apuntes.</p></div>`;
}

function viewProgreso(){
  const ids=[...new Set(Object.values(S.sessions).flatMap(s=>Object.keys(s.ex||{})))].filter(id=>historyFor(id).length);
  let h=viewRanks();
  h+=`<div class="card"><div class="row between"><h3>Análisis de tu progreso</h3></div><p class="small muted">Compara tus últimas semanas ejercicio por ejercicio y te dice qué ha mejorado, qué se ha estancado y qué cambiar.</p>${injured().length?aviso("lesion"):""}
   ${aiBtn("ai-progress","Analizar mis marcas",ids.length<1)}<div class="ai" id="aiProgOut">${esc((S.meta.progAI&&S.meta.progAI.text)||"")}</div>${S.meta.progAI?`<p class="small muted">Análisis del ${dmy(S.meta.progAI.date)}</p>`:""}</div>`;
  if(!ids.length)return h+`<div class="empty">Cuando completes series aparecerán aquí tus gráficas por ejercicio.</div>`;
  if(!selEx||!ids.includes(selEx))selEx=ids[0];
  const ex=EXI(selEx);const hist=historyFor(selEx).slice().reverse();
  const pts=hist.map(x=>({d:x.date,a:metric(ex,x.sets)}));
  h+=`<div class="card"><label class="f">Ejercicio<select id="exSel">${ids.map(id=>`<option value="${id}" ${id===selEx?"selected":""}>${esc(EXI(id).n)}</option>`).join("")}</select></label>
   <h3>${ex.type==="bw"?"Mejor serie (reps)":ex.type==="time"?"Mejor serie (segundos)":"1RM estimado (kg)"}</h3>${lineChart(pts)}
   <p class="small muted">El 1RM estimado combina peso y repeticiones en un número para comparar sesiones (fórmula de Epley). Es aproximado.</p>
   <div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Series</th></tr></thead><tbody>${hist.slice().reverse().map(x=>`<tr><td class="num">${dmy(x.date)}</td><td>${x.sets.map(s=>(ex.type?"":fmt(s.kg)+"×")+s.reps).join(" · ")}</td></tr>`).join("")}</tbody></table></div></div>`;
  return h;
}
function lineChart(pts,opt={}){
  const W=600,H=200,pl=44,pr=16,pt=16,pb=28;const vals=pts.map(p=>p.a).filter(v=>v!=null);
  if(!vals.length)return `<div class="empty">Sin datos suficientes.</div>`;
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<2){lo-=1;hi+=1}const pad=(hi-lo)*.15;lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);
  const t0=new Date(pts[0].d).getTime(),t1=new Date(pts[pts.length-1].d).getTime();
  const X=d=>pts.length===1?(pl+(W-pl-pr)/2):pl+(W-pl-pr)*((new Date(d).getTime()-t0)/Math.max(1,t1-t0));
  const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g="";for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fmt(v,opt.dec??0)}</text>`}
  [pts[0],pts[pts.length-1]].filter((p,i,a)=>a.indexOf(p)===i).forEach((p,i)=>g+=`<text x="${X(p.d)}" y="${H-8}" text-anchor="${pts.length===1?"middle":i?"end":"start"}" font-size="11" fill="var(--muted)" font-family="JetBrains Mono,monospace">${dmy(p.d)}</text>`);
  const ps=pts.filter(p=>p.a!=null);
  g+=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#cg)" points="${X(ps[0].d)},${H-pb} ${ps.map(p=>X(p.d)+","+Y(p.a)).join(" ")} ${X(ps[ps.length-1].d)},${H-pb}"/>`;g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${ps.map(p=>X(p.d)+","+Y(p.a)).join(" ")}"/>`;
  ps.forEach((p,i)=>g+=`<circle cx="${X(p.d)}" cy="${Y(p.a)}" r="${i===ps.length-1?5:3}" fill="var(--accent)"/>`);
  const L=ps[ps.length-1];g+=`<text x="${Math.min(X(L.d),W-pr)}" y="${Y(L.a)-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--accent)" font-family="JetBrains Mono,monospace">${fmt(L.a,opt.dec??1)}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica">${g}</svg></div>`;
}

   <div class="row">${aiBtn("ai-plan","Rehacer mi plan con Claude")}<button data-act="plan-template">Volver a la plantilla</button></div>
   ${aviso(injured().length?"lesion":"entreno")}<p class="small muted">Cambiar de plan cada pocas semanas frena el progreso. Rehazlo si cambian tus días, tu material o tu objetivo, o si llevas 3 semanas sin mejorar en casi nada.</p></div>`;

let foodDate=today(),pendingPhoto=null,pendingResult=null,foodView="hoy";
function totals(ds){const d=day(ds);const t={kcal:0,p:0,c:0,g:0,veg:0,n:0};if(d)d.meals.forEach(m=>{t.kcal+=m.kcal||0;t.p+=m.p||0;t.c+=m.c||0;t.g+=m.g||0;if(m.veg)t.veg++;t.n++});return t}
function ring(val,target,label,color,unit){
  const r=34,c=2*Math.PI*r,pct=target?clamp(val/target,0,1.25):0;const over=val>target*1.1;
  return `<div class="ring"><svg viewBox="0 0 84 84" role="img" aria-label="${esc(label)} ${Math.round(val)} de ${target} ${unit}"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="8"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${over?"var(--warn)":color}" stroke-width="8" stroke-linecap="round" class="arc" stroke-dasharray="${c*Math.min(pct,1)} ${c}" data-dash="${c*Math.min(pct,1)} ${c}" transform="rotate(-90 42 42)"/><text x="42" y="40" text-anchor="middle" font-family="Unbounded,Arial Black,sans-serif" font-weight="700" font-size="16" fill="var(--fg)">${Math.round(val)}</text><text x="42" y="56" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Instrument Sans,sans-serif">/ ${target}${unit}</text></svg><span class="l">${esc(label)}</span></div>`}
function ringsCard(ds){const t=totals(ds),g=T();
  return `<div class="rings">${ring(t.kcal,g.kcal,"Calorías","var(--accent)","")}${ring(t.p,g.prot,"Proteína","var(--p)","g")}${ring(t.c,g.carb,"Hidratos","var(--c)","g")}${ring(t.g,g.fat,"Grasa","var(--g)","g")}</div>`}

  ${adaptiveCard()}${aviso("comida")}`;
  return h;

/* Mantenimiento real: lo que comes de media menos lo que cambia tu peso (7.700 kcal ≈ 1 kg). Necesita datos de 14+ días. */
function adaptiveCard(){
  const days=[...Array(21)].map((_,i)=>addDays(today(),-i-1));
  const logged=days.filter(ds=>{const d=day(ds);return d&&d.meals.length>=2});
  const w=Object.entries(S.body).filter(([d,v])=>v.kg&&d>=days[days.length-1]).sort();
  if(logged.length<10||w.length<6)return `<div class="note">Con 10 días de comidas registradas y 6 pesadas en 3 semanas, Gymnarly calcula tu mantenimiento real (ahora: ${logged.length} días y ${w.length} pesadas).</div>`;
  const avg=logged.reduce((a,ds)=>a+totals(ds).kcal,0)/logged.length;
  const half=Math.floor(w.length/2);const a1=w.slice(0,half).reduce((a,x)=>a+x[1].kg,0)/half,a2=w.slice(half).reduce((a,x)=>a+x[1].kg,0)/(w.length-half);
  const daysSpan=(new Date(w[w.length-1][0])-new Date(w[0][0]))/864e5||1;const perDay=(a2-a1)/(daysSpan/2);
  const maint=Math.round((avg-perDay*7700)/50)*50;
  return `<div class="card"><h3>Tu mantenimiento real</h3><p>Comes de media <b>${Math.round(avg)} kcal</b> y tu peso cambia ${perDay>0?"+":""}${fmt(perDay*7,2)} kg/semana → mantenimiento ≈ <b>${maint} kcal</b> (la fórmula decía ${T().tdee}).</p><p class="small muted">Solo es fiable si registras casi todo lo que comes. Si la diferencia es grande, puedes ajustar tu objetivo en Logros → Perfil.</p></div>`;
}

  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=420;const g=AC.createGain();g.gain.value=0;
  const lfo=AC.createOscillator();lfo.frequency.value=0.09;const lg=AC.createGain();lg.gain.value=0.05;lfo.connect(lg);lg.connect(g.gain);
  src.connect(lp);lp.connect(g);g.connect(AC.destination);src.start();lfo.start();g.gain.setTargetAtTime(0.09,AC.currentTime,1.5);AMB={src,lfo,g}}catch(e){}}

const TIERS=[["Hierro","#6b6f72"],["Bronce","#a8693a"],["Plata","#8e9aa3"],["Oro","#c79a1c"],["Platino","#2f9e98"],["Diamante","#4a7bf0"],["Élite","#b0306a"]];
const PROG_STD=[0,1.0,1.05,1.10,1.20,1.30,1.45];
const ABS={banca:[0,.5,.75,1,1.25,1.5,1.85],sentadilla:[0,.75,1,1.25,1.5,1.75,2.25]};
const RGROUPS=[["pecho","Pecho",["pecho"],"banca"],["espalda","Espalda",["espalda"]],["hombro","Hombro",["hombro"]],["brazos","Brazos",["biceps","triceps"]],["pierna","Pierna y glúteo",["pierna","gluteo"],"sentadilla"],["core","Core",["core"]]];
function bodyKg(){const e=Object.entries(S.body).filter(([d,v])=>v&&v.kg).sort((a,b)=>a[0]<b[0]?1:-1);if(!e.length)return S.profile?S.profile.peso:null;const lim=addDays(e[0][0],-13);const r=e.filter(([d])=>d>=lim);return r.reduce((a,[d,v])=>a+v.kg,0)/r.length}
const tierOf=(v,std)=>{let t=0;std.forEach((x,i)=>{if(i&&v>=x)t=i});return t};
function rankOf(gr){
  const [gid,gn,muscles,absId]=gr;const ids=[...new Set(Object.values(S.sessions).flatMap(s=>Object.keys(s.ex||{})))].filter(id=>muscles.includes(EXI(id).g)&&historyFor(id).length);
  const zh=absId?zoneHit(LIB[absId]||{}):[];
  if(absId&&ids.includes(absId)&&!zh.length){const ex=EXI(absId);const h=historyFor(absId);const e=Math.max(...h.slice(0,3).map(x=>metric(ex,x.sets)||0));const bw=bodyKg();
    if(e&&bw){const f=S.profile.sexo==="f"?(absId==="banca"?.65:.75):1;const std=ABS[absId].map(x=>x*f);const r=e/bw;const t=tierOf(r,std);
      const nx=t<6?`Para ${TIERS[t+1][0]}: ${ex.n.toLowerCase()} ≈ ${fmt(Math.ceil(std[t+1]*bw/(1+8/30)/2.5)*2.5)} kg × 8.`:"";
      return {t,val:r.toFixed(2).replace(".",",")+" × tu peso",txt:`1RM estimado ${fmt(e)} kg con ${fmt(bw)} kg de peso. Escala orientativa de fuerza de población.`,nx,pct:t<6?(r-std[t])/(std[t+1]-std[t]):1}}}
  const rs=[];let worst=null;ids.forEach(id=>{const ex=EXI(id);const h=historyFor(id);const first=metric(ex,h[h.length-1].sets),rec=Math.max(...h.slice(0,2).map(x=>metric(ex,x.sets)||0));if(first&&rec){const r=rec/first;rs.push(r);if(!worst||r<worst.r)worst={id,r}}});
  if(!rs.length)return {t:0,val:"–",txt:"Sin registros todavía.",nx:"",pct:0};
  const r=rs.reduce((a,b)=>a+b,0)/rs.length;const t=tierOf(r,PROG_STD);
  return {t,val:(r>=1?"+":"")+fmt((r-1)*100)+" %",txt:"Mejora media frente a tu primera marca en cada ejercicio.",nx:t<6?`Para ${TIERS[t+1][0]}: +${Math.round((PROG_STD[t+1]-1)*100)} %. Tira hacia abajo: ${EXI(worst.id).n}.`:"",pct:t<6?clamp((r-PROG_STD[t])/(PROG_STD[t+1]-PROG_STD[t]),0,1):1};
}

function wheelHtml(){const n=8,R=100;let s="";for(let i=0;i<n;i++){const a0=(i*45-90)*Math.PI/180,a1=((i+1)*45-90)*Math.PI/180;

/* ================= AMIGOS =================
   Cada persona publica SOLO un resumen (nombre que elige, XP de la semana, nivel, racha, misiones de hoy) en pub/<su id>,
   y solo si está en algún grupo. Sus comidas, pesos y notas siguen en su espacio privado. Un grupo es un código de 6 letras. */
let FR={db:null,uid:null,ok:null,err:"",members:[],unsub:null,sel:null,pubT:null,joinErr:""};
const AV_COLORS=["#ff6a4d","#ffbf47","#8f9dff","#59e0a0","#ff8fb1","#c59bff","#45c4a8","#ffd27a"];
const myGroups=()=>(S.meta.groups||[]);
async function friendsInit(){
  try{if(!window.claude||!window.claude.use){FR.ok=false;return}
    const db=await window.claude.use("db"),u=await window.claude.use("user");if(!db||!u){FR.ok=false;return}
    FR.db=db;FR.uid=await u.id();FR.ok=!!FR.uid;
    if(FR.ok&&myGroups().length){if(!FR.sel)FR.sel=myGroups()[0].c;subscribeGroup();publishMe()}
    if(tab==="amigos")render();
  }catch(e){FR.ok=false}
}
function myCard(){const g=game(),pl=pillars(today());const p=S.profile||{};
  return {name:String(p.nombre||"Sin nombre").slice(0,24),color:AV_COLORS[hash(FR.uid||"x")%AV_COLORS.length],codes:myGroups().map(x=>x.c),gnames:Object.fromEntries(myGroups().map(x=>[x.c,x.n])),
    week:weekStart(today()),xpWeek:g.boss.dmg,xpTotal:g.xp,level:g.L,title:g.title,streak:g.streak,today:{d:today(),f:pl.food,t:pl.train,m:pl.mind},kudos:S.meta.kudosOut||{},updated:Date.now()}}
function publishMe(now){if(!FR.ok||!FR.db)return;clearTimeout(FR.pubT);FR.pubT=setTimeout(async()=>{
  try{const ref=FR.db.collection("pub").doc(FR.uid);if(!myGroups().length){await ref.delete().catch(()=>{});return}await ref.set(myCard());FR.err=""}
  catch(e){FR.err=e&&e.code||"error";if(tab==="amigos")render()}},now?0:4000)}
function subscribeGroup(){if(FR.unsub){try{FR.unsub()}catch(e){}FR.unsub=null}FR.members=[];if(!FR.sel||!FR.db)return;
  try{FR.unsub=FR.db.collection("pub").where("codes","array-contains",FR.sel).onSnapshot(snap=>{FR.members=snap.docs.map(d=>Object.assign({id:d.id},d.data()||{}));if(tab==="amigos")render()},e=>{FR.err=e&&e.code||"error";if(tab==="amigos")render()})}catch(e){FR.err="error"}}
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
async function createGroup(name){name=(name||"").trim().slice(0,30)||"Mi grupo";const c=genCode();S.meta.groups=[...myGroups(),{c,n:name}];S.meta.updated=Date.now();touch("meta");FR.sel=c;subscribeGroup();publishMe(true);afterAction("Grupo creado: "+name)}
async function joinGroup(code){code=(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"");FR.joinErr="";
  if(code.length!==6){FR.joinErr="El código tiene 6 letras o números.";render();return}
  if(myGroups().some(g=>g.c===code)){FR.sel=code;subscribeGroup();render();return}
  try{const snap=await FR.db.collection("pub").where("codes","array-contains",code).limit(1).get();
    if(!snap.docs.length){FR.joinErr="No hay ningún grupo con ese código. Revísalo con quien te lo pasó.";render();return}
    const d=snap.docs[0].data()||{};const n=(d.gnames&&d.gnames[code])||"Grupo";
    S.meta.groups=[...myGroups(),{c:code,n}];S.meta.updated=Date.now();touch("meta");FR.sel=code;subscribeGroup();publishMe(true);afterAction("Te has unido a "+n)}
  catch(e){FR.joinErr="No se pudo buscar el grupo ("+(e&&e.code||"error")+").";render()}}
function leaveGroup(c){S.meta.groups=myGroups().filter(g=>g.c!==c);S.meta.updated=Date.now();touch("meta");FR.sel=myGroups()[0]?myGroups()[0].c:null;subscribeGroup();publishMe(true);render();toast("Has salido del grupo")}
function kudo(uid){const k=S.meta.kudosOut||(S.meta.kudosOut={});k[uid]=today();S.meta.updated=Date.now();touch("meta");publishMe(true);beep(2,880);render();toast("¡Chócala enviada!")}
function viewAmigos(){
  let h=`<div class="sec-h"><div><p class="eyebrow">Amigos</p><h1>Entrenar<br>en <span class="grad-t">equipo</span></h1></div></div>`;
  if(FR.ok===false)return h+`<div class="card"><h3>Disponible al abrir Gymnarly desde claude.ai</h3><p class="muted small">El modo amigos guarda un resumen compartido (tu nombre, XP de la semana, nivel y racha) y para eso necesita tu cuenta.</p></div>`;
  if(FR.ok===null)return h+`<div class="empty">Conectando…</div>`;
  const gs=myGroups();
  if(gs.length){h+=`<div class="seg">${gs.map(g=>`<button class="chip" data-grp="${g.c}" aria-pressed="${g.c===FR.sel}">${esc(g.n)}</button>`).join("")}</div>`;
    const cur=gs.find(g=>g.c===FR.sel)||gs[0];const ws=weekStart(today());
    let ms=FR.members.slice();if(!ms.some(m=>m.id===FR.uid))ms.push(Object.assign({id:FR.uid},myCard()));
    ms=ms.map(m=>m.id===FR.uid?Object.assign({},m,myCard()):m).map(m=>Object.assign(m,{wx:m.week===ws?(m.xpWeek||0):0})).sort((a,b)=>b.wx-a.wx);
    const hp=1200*ms.length,dmg=ms.reduce((a,m)=>a+m.wx,0),left=Math.max(0,hp-dmg);const boss=BOSSES[hash(ws+cur.c)%BOSSES.length];
    const recv=ms.filter(m=>m.id!==FR.uid&&m.kudos&&m.kudos[FR.uid]===today()).map(m=>m.name);
    h+=`<div class="card game"><div class="boss"><div class="bsvg">${bossIcon(left===0,72)}</div><div class="stack" style="gap:7px;min-width:0"><p class="eyebrow">Jefe de equipo</p><div class="row between"><h3>${esc(boss[0])}</h3><span class="small muted num">${left} / ${hp} PV</span></div><div class="bar"><span style="width:${100*left/hp}%;background:linear-gradient(90deg,#ff5f7a,#ff6a4d)"></span></div><span class="small muted">${left===0?"Derrotado entre todos. El lunes llega otro.":"Tiene 1.200 PV por cada miembro. Todo el XP del grupo le hace daño."}</span></div></div></div>
    ${recv.length?`<div class="note">🙌 ${esc(recv.join(", "))} te ${recv.length>1?"han chocado":"ha chocado"} la mano hoy.</div>`:""}
    <div class="sec-h"><h2>Esta semana</h2><span class="small muted">XP desde el lunes</span></div>
    <div class="lb">${ms.map((m,i)=>{const me=m.id===FR.uid;const td=m.today&&m.today.d===today()?m.today:{};const sent=(S.meta.kudosOut||{})[m.id]===today();
      return `<div class="lbr ${me?"mine":""}"><span class="pos">${i+1}</span><span class="av" style="background:${esc(m.color||"#8f9dff")}">${esc((m.name||"?")[0].toUpperCase())}</span><div style="min-width:0"><b>${esc(m.name||"Sin nombre")}${me?" (tú)":""}</b><div class="small muted">Nv. ${m.level||1} · ${m.streak||0} días de racha · <span title="Misiones de hoy">${["f","t","m"].map((k,j)=>`<span style="color:${td[k]?["var(--food)","var(--train)","var(--mind)"][j]:"var(--faint)"}">●</span>`).join("")}</span></div></div><div class="stack" style="gap:4px;align-items:flex-end"><span class="xp">${m.wx}</span>${me?"":`<button class="small ${sent?"ghost":""}" data-kudo="${esc(m.id)}" ${sent?"disabled":""}>${sent?"Chocada":"Chócala"}</button>`}</div></div>`}).join("")}</div>
    ${ms.length<2?`<div class="note">Aún estás solo. Pasa el código a tus amigos.</div>`:""}
    <div class="card"><p class="eyebrow">Código del grupo</p><div class="code" id="gCode">${cur.c}</div><button class="primary" data-act="copy-code">Copiar invitación</button><p class="small muted">Tus amigos abren Gymnarly, van a Amigos y meten el código. Solo ven tu nombre, nivel, racha, XP de la semana y si has cumplido las misiones de hoy; nunca tus comidas, pesos ni notas.</p><button class="ghost small" data-leave="${cur.c}" style="color:var(--down)">Salir de este grupo</button></div>`}
  else h+=`<div class="card"><p class="muted">Haz un grupo con tus amigos: veis el ranking de XP de la semana, os chocáis la mano y derrotáis juntos al jefe de equipo.</p><div class="pillars"><div class="pillar" style="--pc:var(--food)"><svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0zM12 14v4M8 21h8"/></svg>Ranking semanal</div><div class="pillar" style="--pc:var(--train)"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M14 5h5v5M5 14l5 5"/></svg>Jefe en equipo</div><div class="pillar" style="--pc:var(--mind)"><svg viewBox="0 0 24 24"><path d="M7 11V6a2 2 0 0 1 4 0v4M11 10V4a2 2 0 0 1 4 0v6M15 10V6a2 2 0 0 1 4 0v8a7 7 0 0 1-14 0v-3a2 2 0 0 1 4 0"/></svg>Chocar la mano</div></div></div>`;
  h+=`<div class="card"><h3>${gs.length?"Otro grupo":"Crear un grupo"}</h3><div class="row" style="flex-wrap:nowrap"><input id="gName" placeholder="Nombre (ej. Los del gym)" maxlength="30"><button class="hot" data-act="grp-create">Crear</button></div>
   <h3>Unirme con un código</h3><div class="row" style="flex-wrap:nowrap"><input id="gJoin" placeholder="ABC123" maxlength="8" autocapitalize="characters" style="font-family:var(--mono);letter-spacing:.15em;text-transform:uppercase"><button class="primary" data-act="grp-join">Unirme</button></div>${FR.joinErr?`<p class="small" style="color:var(--down)">${esc(FR.joinErr)}</p>`:""}
   ${FR.err?`<p class="small" style="color:var(--down)">No se pudo sincronizar con el grupo (${esc(FR.err)}). Si tu amigo no puede unirse, pídele a quien comparte Gymnarly que le dé permiso para usarla (no solo para verla).</p>`:""}</div>`;
  return h;
}

function mealAdvice(t){const g=T();const eaten=totals(foodDate);const out=[];
  const pct=g.kcal?Math.round(100*t.kcal/g.kcal):0;const fatPct=t.kcal?Math.round(900*t.g/t.kcal):0;
  if(t.kcal>200&&t.p<20)out.push(`Le falta proteína: lleva ${Math.round(t.p)} g y lo útil es 25-40 g por comida. Añade ${PROT_IDEAS().join(", ")}.`);

function r5(g){return g<100?Math.max(5,Math.round(g/5)*5):Math.round(g/10)*10}
function buildMeal(tpl,target,b){const its=[];for(const [n,q,u] of tpl[1]){const f=substitute(n,b);if(!f)return null;const g0=u?q*FOODI[n].ug:q;its.push({f,g:g0,u:!!u&&f.n===n,q})}
  if(new Set(its.map(x=>x.f.n)).size<its.length)return null;
  // la verdura y la fruta no se tocan; la proteína se mueve poco (25-45 g por comida es lo útil); hidratos y grasa absorben el resto
  const kc=x=>x.f.k*x.g/100,fx=x=>x.f.f.includes("v")||x.f.k<60,isP=x=>!fx(x)&&x.f.p*4/x.f.k>=.3;
  const fixed=its.filter(fx),prot=its.filter(isP),flex=its.filter(x=>!fx(x)&&!isP(x));
  const kF=fixed.reduce((a,x)=>a+kc(x),0),kP=prot.reduce((a,x)=>a+kc(x),0),kX=flex.reduce((a,x)=>a+kc(x),0);
  const kp=kP>0?clamp((target-kF)/(kP+kX),.8,1.3):1;
  const k=kX>0?clamp((target-kF-kP*kp)/kX,.6,1.7):1;
  const sc=(x,f)=>{if(x.u){x.q=Math.max(1,Math.round(x.q*f));x.g=x.q*x.f.ug}else x.g=r5(x.g*f)};
  prot.forEach(x=>sc(x,kp));flex.forEach(x=>sc(x,k));
  const t={kcal:0,p:0,c:0,g:0};its.forEach(x=>{const m=macrosOf(x.f,x.g);t.kcal+=m.kcal;t.p+=m.p;t.c+=m.c;t.g+=m.g});
  let name=tpl[0];its.forEach((x,j)=>{const o=tpl[1][j][0];if(x.f.n===o)return;const w=NAMEW[o];const nw=x.f.n.split(" (")[0].toLowerCase().replace(/ a la plancha| cocid[oa]s?| en polvo/g,"");
    const re=w&&new RegExp("\\b"+w+"\\b","i");if(re&&re.test(name))name=name.replace(re,m=>m[0]===m[0].toUpperCase()?nw.charAt(0).toUpperCase()+nw.slice(1):nw);else if(!/adaptado/.test(name))name+=" (adaptado)"});
  return {plato:name,ingredientes:its.map(x=>x.u?`${x.f.n} × ${x.q}`:`${x.g} g de ${x.f.n.charAt(0).toLowerCase()+x.f.n.slice(1)}`),kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),g:Math.round(t.g)}}
function localMenu(){const p=S.profile,g=T(),b=banned();const nc=clamp(+p.dieta.comidas||4,3,5);
  const eaten=(day(today())||{meals:[]}).meals;const done=new Set(eaten.map(m=>m.momento));const tot=totals(today());
  let slots=SLOTS[nc].filter(s=>!done.has(s[0]));if(!slots.length)slots=SLOTS[nc].slice(-1);
  const share=slots.reduce((a,s)=>a+s[3],0);const left=Math.max(g.kcal*.25,g.kcal-tot.kcal);
  const prev=new Set(((S.meta.menu&&S.meta.menu.comidas)||[]).map(c=>c.plato.replace(" (adaptado)","")));const used=new Set();
  const comidas=slots.map(([mom,hora,k,sh])=>{const target=left*sh/share;
    const exact=MT[k].filter(t=>t[1].every(([n])=>okFood(FOODI[n],b)));
    const pool=exact.length>=2?exact:MT[k].map(t=>buildMeal(t,target,b)?t:null).filter(Boolean);
    const fresh=pool.filter(t=>!prev.has(t[0])&&!used.has(t[0]));const pick=(fresh.length?fresh:pool)[Math.floor(Math.random()*(fresh.length||pool.length))];
    if(!pick)return null;used.add(pick[0]);const m=buildMeal(pick,target,b);
    let nota="";if(p.dieta.horaEntreno&&k!=="cen"&&mom!=="Desayuno"){const he=parseInt(p.dieta.horaEntreno),hm=parseInt(hora);if(he-hm>=1&&he-hm<=3)nota="Entrenas sobre las "+p.dieta.horaEntreno+": buena comida para 1-3 horas antes."}
    if(p.dieta.cocina==="otro"&&k==="com")nota=(nota?nota+" ":"")+"Si te lo cocinan, pide la ración de proteína que pone y completa con la verdura.";
    return Object.assign({momento:mom,hora,nota},m)}).filter(Boolean);
  const sk=comidas.reduce((a,c)=>a+c.kcal,0),sp=comidas.reduce((a,c)=>a+c.p,0);
  const pl=Math.round(g.prot-tot.p-sp);
  return {date:today(),comidas,nota:`Con lo que llevas hoy sumarías unas ${Math.round(tot.kcal+sk)} kcal y ${Math.round(tot.p+sp)} g de proteína (objetivo ${g.kcal} kcal, ${g.prot} g).${pl>15?" Para llegar a la proteína, añade un skyr, un batido o una lata de atún en alguna comida.":""}`}}

function habitAnalysis(a){const good=[],bad=[];const b=banned();const veg=(S.profile.dieta.restr||[]).some(r=>/Veg/.test(r));
  const v=k=>a[k]??null;
  if(v("fruta")!=null)(v("fruta")>=2?good:bad).push(v("fruta")>=2?`Fruta: ${v("fruta")}+ al día, bien.`:{i:3,t:`Fruta: ${v("fruta")} al día. Cambio: una pieza en el desayuno y otra de merienda (2 al día).`});
  if(v("verdura")!=null)(v("verdura")>=2?good:bad).push(v("verdura")>=2?`Verdura en ${v("verdura")}+ comidas al día.`:{i:4,t:`Verdura: ${v("verdura")} raciones al día. Cambio: medio plato de verdura o ensalada en comida y cena.`});
  if(v("legumbre")!=null)(v("legumbre")>=2?good:bad).push(v("legumbre")>=2?`Legumbre ${v("legumbre")}+ veces por semana.`:{i:2,t:`Legumbre: ${v("legumbre")} veces por semana. Cambio: 2-3 platos de lentejas, garbanzos o alubias a la semana (fibra y proteína baratas).`});
  if(!veg&&!b.includes("P")&&v("pescado")!=null)(v("pescado")>=2?good:bad).push(v("pescado")>=2?`Pescado ${v("pescado")}+ veces por semana.`:{i:2,t:`Pescado: ${v("pescado")} veces por semana. Cambio: 2 a la semana, una de ellas azul (salmón, sardinas, caballa). Vale en lata.`});
  if(v("refresco")!=null)(v("refresco")<=3?good:bad).push(v("refresco")<=3?"Pocos refrescos y zumos.":{i:5,t:`Refrescos o zumos: unos ${v("refresco")} vasos a la semana, ≈ ${Math.round(v("refresco")*90)} kcal solo de azúcar. Cambio: agua, gaseosa o la versión zero.`});
  if(v("bolleria")!=null)(v("bolleria")<=2?good:bad).push(v("bolleria")<=2?"Dulces y bollería con moderación.":{i:4,t:`Bollería o dulces: ${v("bolleria")} veces por semana (≈ ${Math.round(v("bolleria")*250)} kcal). Cambio: deja 2 y sustituye el resto por fruta con yogur o tostada.`});
  if(v("rapida")!=null)(v("rapida")<=1?good:bad).push(v("rapida")<=1?"Poca comida rápida.":{i:4,t:`Comida rápida o precocinados: ${v("rapida")} veces por semana. Cambio: deja una y ten a mano comida rápida casera (tortilla, atún con garbanzos de bote, pasta con pollo).`});
  if(v("alcohol")!=null&&v("alcohol")>2)bad.push({i:5,t:`Alcohol: ${v("alcohol")} bebidas a la semana (≈ ${Math.round(v("alcohol")*120)} kcal). Empeora el sueño y la recuperación. Cambio: cerveza sin alcohol o reducirlo a días sueltos.`});
  bad.sort((x,y)=>y.i-x.i);
  return (good.length?"Lo que haces bien:\n- "+good.join("\n- ")+"\n\n":"")+(bad.length?"Los cambios con más impacto, por orden:\n"+bad.slice(0,3).map((x,i)=>`${i+1}. ${x.t}`).join("\n"):"No hay nada grande que cambiar con estas respuestas. Lo siguiente sería cuadrar la proteína: mira la pestaña Hoy.")}
function weekAnalysis(){const g=T();const days=[...Array(7)].map((_,i)=>addDays(today(),-i)).filter(ds=>day(ds)&&day(ds).meals.length);
  if(days.length<2)return "Registra al menos 2 días para poder analizarlos.";
  const ts=days.map(totals);const avg=k=>ts.reduce((a,t)=>a+t[k],0)/ts.length;
  const kc=avg("kcal"),pr=avg("p"),vg=avg("veg"),nm=avg("n");const pOk=ts.filter(t=>t.p>=g.prot*.9).length;
  const water=days.map(ds=>day(ds).water||0).reduce((a,x)=>a+x,0)/days.length;
  const pick=days.flatMap(ds=>day(ds).meals).filter(m=>m.momento==="Picoteo").length;
  const out=[`Días registrados: ${days.length}. Media: ${Math.round(kc)} kcal (objetivo ${g.kcal}, ${kc>=g.kcal?"+":""}${Math.round(100*(kc-g.kcal)/g.kcal)} %) y ${Math.round(pr)} g de proteína (objetivo ${g.prot}).`];
  const ch=[];
  if(pr<g.prot*.9)ch.push(`Proteína: llegas ${pOk} de ${days.length} días. Te faltan unos ${Math.round(g.prot-pr)} g de media: añade una ración de proteína (huevos, skyr, atún, pollo, tofu) en la comida que vaya más floja.`);
  if(kc<g.kcal*.8&&S.profile.objetivo!=="grasa")ch.push(`Comes un ${Math.round(100-100*kc/g.kcal)} % por debajo de tu objetivo. Si apuntas todo, sube una ración de hidratos (arroz, pan, pasta) al día.`);
  if(kc>g.kcal*1.1)ch.push(`Vas un ${Math.round(100*kc/g.kcal-100)} % por encima de tus kcal. Lo más fácil de recortar: aceite a ojo, bebidas con azúcar y picoteo.`);
  if(vg<2)ch.push(`Verdura o fruta en ${fmt(vg,1)} comidas al día de media. Objetivo: al menos 2.`);
  if(water<g.agua*.75)ch.push(`Agua: ${fmt(water,1)} L de media, objetivo ${fmt(g.agua,1)} L. Ten una botella a la vista.`);
  if(pick>=3)ch.push(`Has apuntado ${pick} picoteos. Si son por hambre, sube la proteína de la comida anterior.`);
  if(nm<2.5)out.push(`Registras ${fmt(nm,1)} comidas al día: si te dejas alguna, las medias salen bajas.`);
  return out.join(" ")+"\n\n"+(ch.length?"Qué cambiar esta semana:\n"+ch.slice(0,3).map((x,i)=>`${i+1}. ${x}`).join("\n"):"Vas bien: proteína, kcal y verdura dentro de rango. Sigue igual.")}

/* ---- progreso del entreno ---- */
function progressAnalysis(){const ids=[...new Set(Object.values(S.sessions).flatMap(s=>Object.keys(s.ex||{})))].filter(id=>historyFor(id).length);
  const up=[],flat=[],down=[];
  ids.forEach(id=>{const ex=EXI(id);const h=historyFor(id).slice().reverse().map(x=>({d:x.date,m:metric(ex,x.sets)})).filter(x=>x.m>0);if(h.length<2)return;
    const u=ex.type==="bw"?" reps":ex.type==="time"?" s":" kg";const a=h[0],z=h[h.length-1];const d=z.m-a.m;
    const last3=h.slice(-3),before=h.slice(0,-3);const stuck=h.length>=4&&Math.max(...last3.map(x=>x.m))<=Math.max(...before.map(x=>x.m));
    const line=`${ex.n}: de ${fmt(a.m)} a ${fmt(z.m)}${u}${ex.type?"":" (1RM estimado)"} en ${h.length} sesiones`;
    if(stuck)flat.push(line);else if(d>0)up.push(line+` (+${Math.round(100*d/a.m)} %)`);else down.push(line)});
  if(!up.length&&!flat.length&&!down.length)return "Necesitas al menos 2 sesiones del mismo ejercicio para comparar.";
  const tips=[];if(flat.length){tips.push("En los estancados, prueba primero a sumar 1-2 repeticiones por serie antes de subir peso.");tips.push("Revisa sueño (7+ horas) y proteína: son la causa más común de estancarse.");if(flat.length>=3)tips.push("Si llevas 3+ semanas sin mejorar en casi nada, haz una semana de descarga: mismos ejercicios con la mitad de series.")}
  if(down.length)tips.push("Si has bajado, mira si coincidió con dormir poco o comer menos; no subas peso esa semana.");
  if(!tips.length)tips.push("Sigue con la misma progresión: cuando hagas el tope de repeticiones en todas las series, sube el peso.");
  if(injured().length)tips.push("En los ejercicios que cargan tu zona lesionada, no subas carga sin el visto bueno de tu fisio.");
  return (up.length?"Mejoras:\n- "+up.join("\n- ")+"\n\n":"")+(flat.length?"Estancados (3 sesiones sin superar tu mejor marca):\n- "+flat.join("\n- ")+"\n\n":"")+(down.length?"Por debajo de donde empezaste:\n- "+down.join("\n- ")+"\n\n":"")+"Qué hacer esta semana:\n"+tips.slice(0,3).map((t,i)=>`${i+1}. ${t}`).join("\n")}

const RISK=/suicid|matarme|quitarme la vida|no quiero vivir|hacerme da(ñ|n)o|autolesi|cortarme|desaparecer para siempre|mejor sin mi|mejor muerto/i;
function mindReply(c){const out=[];const a=c.animo,e=c.estres,en=c.energia,s=c.sueno;
  if(RISK.test(norm(c.nota||"")))return "Lo que escribes es importante y no tienes que llevarlo solo. Habla hoy con alguien de confianza. En España puedes llamar gratis al 024, las 24 horas, y te atiende un profesional. Si hay peligro inmediato, llama al 112.";
  if(a&&a<=2)out.push("Hoy estás bajo de ánimo.");else if(a>=4)out.push("Hoy estás con buen ánimo: aprovéchalo.");
  if(e>=4)out.push("El estrés está alto.");if(s&&s<6.5)out.push(`Has dormido ${fmt(s,1)} horas, menos de lo que necesitas.`);
  const todo=[];
  if(e>=4)todo.push("Haz la respiración coherente de 5 minutos (en Mente). Soltar el aire más largo de lo que lo coges baja las pulsaciones.");
  if(a&&a<=2)todo.push("Sal a caminar 15-20 minutos con luz de día, sin móvil si puedes, y escribe a alguien con quien te apetezca hablar.");
  if(s&&s<6.5)todo.push("Esta noche, pantallas fuera 30 minutos antes de dormir y la meditación Dormir. Si entrenas hoy, quita una serie por ejercicio.");
  if(en&&en<=2&&!(s&&s<6.5))todo.push("Con la energía baja, entrena igual pero sin buscar récords. Come algo con hidratos 1-2 horas antes.");
  if(!todo.length)todo.push("Mantén lo que te funciona hoy y apunta una cosa que haya salido bien.");
  if(todo.length<2)todo.push("Bebe agua y haz 2 minutos de respiración en caja antes de la próxima tarea.");
  const q=a&&a<=2?"¿Qué es lo más pequeño que podrías hacer hoy que te haría sentir un poco mejor?":e>=4?"De lo que te preocupa, ¿qué depende de ti y qué no?":"¿Qué quieres que haya salido bien cuando acabe el día?";
  return (out.length?out.join(" ")+"\n\n":"")+"Para hoy:\n- "+todo.slice(0,2).join("\n- ")+"\n\nPara pensar: "+q+(a&&a<=2?"\n\nSi llevas más de dos semanas así, habla con tu médico o con un psicólogo.":"")}

document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b||b.disabled)return;const D=b.dataset;
  if(D.lfadd!=null){const f=FOODS[+D.lfadd];PLATE.push({i:+D.lfadd,g:f.ug||100});LFQ="";const q=$("#lfq");if(q)q.value="";const r=$("#lfRes");if(r)r.innerHTML=resultsHtml();refreshPlate();return}
  if(D.lfdel!=null){PLATE.splice(+D.lfdel,1);refreshPlate();return}
  if(D.lfu){const [j,s]=D.lfu.split(":");const x=PLATE[+j];const f=FOODS[x.i];x.g=Math.max(0,Math.round(x.g+(+s)*f.ug));if(!x.g)PLATE.splice(+j,1);refreshPlate();return}
  if(D.hq){const [k,v]=D.hq.split(":");const q=S.profile.dieta.habQ||(S.profile.dieta.habQ={});q[k]=+v;S.profile.updated=Date.now();touch("profile");render();return}
  if(D.lfdelf){const fl=S.meta.fl||{};delete fl[D.lfdelf];S.meta.updated=Date.now();touch("meta");render();toast("Quitado del ranking");return}
  switch(D.lf){
    case "save":{if(!PLATE.length)return;const t=plateTotals();const a=mealAdvice(t);const mom=($("#lfMom")||{}).value||guessMoment();
      const names=PLATE.map(x=>FOODS[x.i].n);const name=names.length>3?names.slice(0,3).join(", ")+"…":names.join(", ");
      PLATE=[];LFMOM=null;addMeal({name,kcal:Math.round(t.kcal),p:Math.round(t.p),c:Math.round(t.c),g:Math.round(t.g),veg:t.veg,momento:mom,falta:/^Nada/.test(a.falta)?"":a.falta,src:"buscador"});return}
    case "clear":PLATE=[];refreshPlate();return;
    case "menu":await AIH["ai-menu"]();toast("Menú listo");return;
    case "share":{const url=shareUrl();const g=game();const txt=`${(S.profile&&S.profile.nombre)||"Yo"} lleva ${g.boss.dmg} XP esta semana en Gymnarly (nivel ${g.L}, ${g.streak} días de racha). Abre el enlace para añadirme a tu ranking:`;
      try{if(navigator.share){await navigator.share({title:"Gymnarly",text:txt,url});return}}catch(x){if(x&&x.name==="AbortError")return}
      try{await navigator.clipboard.writeText(txt+" "+url);toast("Enlace copiado. Pégalo en WhatsApp")}catch(x){prompt("Copia este enlace",url)}return}
    case "install":if(INSTALL){INSTALL.prompt();try{await INSTALL.userChoice}catch(x){}INSTALL=null;render()}return;
    case "hide-install":S.meta.hideInstall=true;S.meta.updated=Date.now();touch("meta");render();return;
  }
});
