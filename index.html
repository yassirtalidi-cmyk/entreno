<style>

.rbar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}.rbar span{display:block;height:100%;background:var(--tc)}

<script>
/* ============ RUTINA VIGENTE (Notion · ENTRENO, a 9/11/2026) ============ */
const EX = {
  banca:{n:"Press banca",g:"Pecho",step:2.5,start:75,cue:"Escápulas atrás y abajo, pies firmes, barra al esternón bajo."},
  inclinado:{n:"Press inclinado con mancuernas",g:"Pecho",step:2.5,start:30,unit:"kg por mancuerna",cue:"Banco a 30°, codos a 45-60°, baja hasta estirar el pecho."},
  militar:{n:"Press militar en máquina",g:"Hombro",step:2.5,start:27.5,unit:"kg por lado",sh:true,cue:"Espalda pegada al respaldo, no arquees lumbar."},
  laterales:{n:"Elevación lateral unilateral en polea",g:"Hombro",step:2.2,start:6.8,uni:true,sh:true,cue:"Codo ligeramente flexionado, sube hasta la altura del hombro, sin impulso."},
  triceps:{n:"Extensión de tríceps en polea",g:"Tríceps",step:2.2,start:33.8,cue:"Codos pegados al cuerpo, extensión completa abajo."},
  jalon:{n:"Jalón al pecho",g:"Espalda",step:7,start:73,cue:"Pecho arriba, lleva los codos hacia los bolsillos."},
  remo:{n:"Remo unilateral en máquina",g:"Espalda",step:2.5,start:37.5,uni:true,cue:"El lado izquierdo marca las reps: el derecho iguala, no supera."},
  pullover:{n:"Pullover en polea",g:"Espalda",step:2.2,start:27,sh:true,cue:"Brazos casi rectos, arco hasta los muslos. Solo si el hombro está sin dolor."},
  bayes:{n:"Curl bayesiano",g:"Bíceps",step:2.3,start:15.8,uni:true,cue:"Brazo por detrás del cuerpo, codo fijo."},
  martillo:{n:"Curl martillo con cuerda",g:"Bíceps",step:2.2,start:22.5,cue:"Codos quietos, sin balanceo."},
  posterior:{n:"Hombro posterior (dos poleas)",g:"Hombro",step:2.2,start:4.5,unit:"kg por lado",cue:"Abre en cruz a la altura del hombro, pausa atrás."},
  predicador:{n:"Curl predicador barra Z",g:"Bíceps",step:2.5,start:25,unit:"kg sin barra",cue:"Baja controlado hasta casi extender, sin rebote."},
  poleasAltas:{n:"Cruce de poleas altas",g:"Pecho",step:2,start:14,unit:"kg por lado",cue:"Mismo peso en las 3 series."},
  poleasBajas:{n:"Cruce de poleas bajas",g:"Pecho",step:2,start:14,unit:"kg por lado",cue:"Sube hacia la barbilla, pecho alto."},
  jalonCerrado:{n:"Jalón al pecho agarre cerrado",g:"Espalda",step:7,start:66,cue:"Mismo peso en las 3 series."},
  remoAmplio:{n:"Remo agarre amplio",g:"Espalda",step:2.5,start:39,cue:"Codos abiertos, aprieta escápulas."},
  saltos:{n:"Saltos frontal y lateral",g:"Potencia",type:"check",knee:true,cue:"Aterriza blando y aguanta 2 s. Si el aterrizaje sale mal, para."},
  bosu:{n:"Sentadilla en bosu",g:"Cuádriceps",type:"bw",knee:true,stopRule:true,cue:"Regla: si una serie acaba con RIR 1 o menos, no hagas la siguiente."},
  sumo:{n:"Sentadilla sumo",g:"Cuádriceps/Glúteo",step:2.5,start:20,knee:true,cue:"Rodillas en línea con los pies."},
  hip:{n:"Hip thrust (máquina guiada)",g:"Glúteo",step:2.5,start:12.5,knee:true,unit:"kg de disco",cue:"Pausa arriba, barbilla recogida."},
  extension:{n:"Extensión de cuádriceps unilateral",g:"Cuádriceps",step:2,startL:25,startR:41,uni:true,knee:true,legs:true,cue:"Empieza por la izquierda (operada). Mismo peso las 3 series."},
  femoral:{n:"Curl femoral unilateral",g:"Isquios",step:2.2,startL:23,startR:27,uni:true,knee:true,legs:true,cue:"Empieza por la izquierda. RIR 2 o más en la operada."},
  abductor:{n:"Abductor en máquina",g:"Glúteo medio",step:4,start:50,knee:true,cue:"Mismo peso desde la primera serie."}
};
const DAYS = {
  lun:{n:"Lunes",t:"Pecho · hombro · tríceps",ex:[["banca",3,8,10,"1-2",180],["inclinado",3,8,12,"1-2",150],["militar",3,8,12,"1-2",120],["laterales",3,10,12,"1",90],["triceps",3,10,12,"1-2",90]]},
  mar:{n:"Martes",t:"Espalda · bíceps",ex:[["jalon",4,8,12,"1-2",150],["remo",4,10,12,"1-2",120],["pullover",3,10,12,"1-2",90],["bayes",3,8,10,"1",90],["martillo",3,8,10,"1",90]]},
  mie:{n:"Miércoles",t:"Pierna (rodilla)",ex:[["saltos",3,5,5,"—",90],["bosu",3,8,8,"2-3",90],["sumo",3,10,12,"2-3",120],["hip",3,10,12,"2",120],["extension",3,10,12,"2",90],["femoral",3,10,12,"2",90],["abductor",3,12,15,"2",90]]},
  jue:{n:"Jueves",t:"Hombro · brazo",ex:[["militar",3,8,12,"1-2",120],["laterales",3,10,12,"1",90],["posterior",3,12,15,"1",90],["triceps",4,10,12,"1-2",90],["predicador",3,8,10,"1",90],["martillo",3,8,10,"1",90]]},
  vie:{n:"Viernes",t:"Pecho · espalda",ex:[["inclinado",3,8,10,"1-2",150],["poleasAltas",3,10,12,"1-2",90],["poleasBajas",3,10,12,"1-2",90],["jalonCerrado",3,8,12,"1-2",120],["remoAmplio",3,10,12,"1-2",120]]},
  sab:{n:"Sábado",t:"Pierna (rodilla)",ex:[["saltos",3,5,5,"—",90],["bosu",3,8,8,"2-3",90],["sumo",3,10,12,"2-3",120],["hip",3,10,12,"2",120],["extension",3,10,12,"2",90],["femoral",3,10,12,"2",90],["abductor",3,12,15,"2",90]]},
  dom:{n:"Domingo",t:"Natación",ex:[]}
};
const DAYKEYS=["dom","lun","mar","mie","jue","vie","sab"];
const AUTH_DEFAULT="Escribe aquí lo que te ha autorizado la fisio, con fecha.";

/* ============ REGISTROS PREVIOS (Notion, oct-nov 2026) ============ */
const u=(kgL,repsL,kgR,repsR,rir)=>({kgL,repsL,kgR,repsR,rir,done:true});
const s=(kg,reps,rir)=>({kg,reps,rir:rir??null,done:true});
const rep=(n,f)=>Array.from({length:n},f);
const SEED_SESSIONS=[];
const SEED_BODY={};

/* ============ ESTADO Y GUARDADO ============ */
const LS_KEY="entreno-yassir-v1";
let S={sessions:{},body:{},knee:{},config:{auth:AUTH_DEFAULT,routine:null,seeded:false}};
let DB=null, COL=null, dirty=new Set(), saveTimer=null, syncMode="local";
function lsRead(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsWrite(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function docIdForSession(id){return "s-"+id}
function markDirty(key){dirty.add(key);lsWrite();clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  if(!COL){dirty.clear();return}
  const keys=[...dirty];dirty.clear();
  for(const k of keys){
    try{
      if(k.startsWith("s-")){const sid=k.slice(2);const v=S.sessions[sid];
        if(v) await COL.doc(k).set(JSON.parse(JSON.stringify(v))); else await COL.doc(k).delete();}
      else if(k==="body") await COL.doc("body").set({entries:S.body});
      else if(k==="knee") await COL.doc("knee").set({entries:S.knee});
      else if(k==="config") await COL.doc("config").set(JSON.parse(JSON.stringify(S.config)));
      setSync("ok");

  }
}
function setSync(m,code){

function seedIfEmpty(){
  if(S.config.seeded)return false;
  for(const x of SEED_SESSIONS){const id=x.date+"-"+x.day;if(!S.sessions[id]){S.sessions[id]={id,date:x.date,day:x.day,ex:Object.fromEntries(Object.entries(x.ex).map(([k,v])=>[k,{sets:v}])),src:"Notion"};dirty.add(docIdForSession(id))}}
  for(const [d,v] of Object.entries(SEED_BODY)){if(!S.body[d])S.body[d]=v}
  S.config.seeded=true;dirty.add("body");dirty.add("config");return true;
}
async function initStore(){
  const local=lsRead(); if(local&&local.sessions){S=Object.assign(S,local);S.config=Object.assign({auth:AUTH_DEFAULT},S.config)}
  seedIfEmpty(); lsWrite(); render();
  if(!window.claude||!window.claude.use){setSync("local");return}
  try{
    const db=await window.claude.use("db"); const user=await window.claude.use("user");
    if(!db||!user){setSync("local");return}
    const uid=await user.id(); if(!uid){setSync("local");return}
    DB=db; COL=db.collection("data/users/"+uid);
    const snap=await COL.get();
    const remote={sessions:{},body:null,knee:null,config:null};
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;
      if(d.id.startsWith("s-"))remote.sessions[d.id.slice(2)]=JSON.parse(JSON.stringify(v));
      else if(d.id==="body")remote.body=JSON.parse(JSON.stringify(v.entries||{}));
      else if(d.id==="knee")remote.knee=JSON.parse(JSON.stringify(v.entries||{}));
      else if(d.id==="config")remote.config=JSON.parse(JSON.stringify(v));});
    // Fusión: gana el registro más reciente; lo que solo está en local se sube.
    for(const [id,v] of Object.entries(remote.sessions)){const l=S.sessions[id];if(!l||(v.updated||0)>=(l.updated||0))S.sessions[id]=v}
    for(const id of Object.keys(S.sessions)){const r=remote.sessions[id];if(!r||(S.sessions[id].updated||0)>(r.updated||0))dirty.add(docIdForSession(id))}
    if(remote.body){S.body=Object.assign({},S.body,remote.body)}dirty.add("body");
    if(remote.knee){S.knee=Object.assign({},S.knee,remote.knee)}dirty.add("knee");
    if(remote.config){S.config=Object.assign({},S.config,remote.config)}dirty.add("config");
    setSync("ok"); lsWrite(); render(); flush();
  }catch(e){setSync("local")}
}

function routine(){return S.config.routine||DAYS}
function presc(dayKey,exId){const r=routine()[dayKey];const e=r&&r.ex.find(x=>x[0]===exId);if(!e)return null;return {id:e[0],sets:e[1],lo:e[2],hi:e[3],rir:e[4],rest:e[5]}}

/* ============ HISTORIAL Y PROGRESIÓN ============ */
function historyFor(exId,beforeDate){
  return Object.values(S.sessions).filter(x=>x.ex&&x.ex[exId]&&x.ex[exId].sets&&x.ex[exId].sets.some(isLogged)&&(!beforeDate||x.date<beforeDate))
    .sort((a,b)=>a.date<b.date?1:-1).map(x=>({date:x.date,day:x.day,sets:x.ex[exId].sets.filter(isLogged)}));
}
function isLogged(st){return st&&(st.done||st.reps!=null||st.repsL!=null||st.repsR!=null)}
function mode(arr){const c={};let best=null,bc=0;arr.filter(v=>v!=null).forEach(v=>{c[v]=(c[v]||0)+1;if(c[v]>bc||(c[v]===bc&&v>best)){bc=c[v];best=v}});return best}
function sideSets(sets,side){
  if(side==="L")return sets.map(x=>({kg:x.kgL,reps:x.repsL,rir:x.rir}));
  if(side==="R")return sets.map(x=>({kg:x.kgR,reps:x.repsR,rir:x.rir}));
  return sets.map(x=>({kg:x.kg,reps:x.reps,rir:x.rir}));
}
/* Doble progresión: sube carga cuando TODAS las series llegan al tope del rango sin RIR 0. */
function evalSide(ex,p,hist,side){
  const startKg=side==="L"?(ex.startL??ex.start):side==="R"?(ex.startR??ex.start):ex.start;
  if(!hist.length)return {kg:startKg,lvl:"info",head:fmt(startKg)+" kg",why:"Sin registro previo: peso de partida de tu rutina. Ajusta para quedar en RIR "+p.rir+"."};
  const last=sideSets(hist[0].sets,side).filter(x=>x.reps!=null);
  if(!last.length)return {kg:startKg,lvl:"info",head:fmt(startKg)+" kg",why:"Sin repeticiones apuntadas la última vez."};
  const kgs=new Set(last.map(x=>x.kg)); const mixed=kgs.size>1;
  // Peso de referencia: el más alto con el que TODAS sus series llegaron al mínimo del rango; si ninguno, el más bajo usado.
  const byKg=[...kgs].filter(k=>k!=null).sort((a,b)=>b-a);
  let W=byKg.find(k=>last.filter(x=>x.kg===k).every(x=>x.reps>=p.lo)); if(W==null)W=byKg[byKg.length-1];
  if(W==null)return {kg:startKg,lvl:"info",head:fmt(startKg)+" kg",why:"Sin peso apuntado la última vez."};
  const lastW=last.filter(x=>x.kg===W);
  const allTop=lastW.length>=Math.min(p.sets,last.length)&&lastW.every(x=>x.reps>=p.hi&&(x.rir==null||x.rir>=1));
  const anyBelow=lastW.some(x=>x.reps<p.lo);
  const repsTxt=last.map(x=>x.reps).join(", ");
  const mixNote=mixed?" Cambiaste de peso dentro del bloque: hoy el mismo peso en todas las series.":"";
  const next=roundStep(W+ex.step); const jump=ex.step/W;
  if(allTop){
    if(jump>0.10&&!ex.knee){
      const allXtra=lastW.every(x=>x.reps>=p.hi+3);
      if(!allXtra)return {kg:W,lvl:"keep",head:fmt(W)+" kg · busca "+(p.hi+1)+"-"+(p.hi+3)+" reps",why:"Hiciste "+repsTxt+". Subir a "+fmt(next)+" kg sería +"+Math.round(jump*100)+" % de golpe (el salto 6,8→9 kg ya te costó el hombro). Primero alarga reps."+mixNote,big:true};
    }
    return {kg:next,lvl:"up",head:"Sube a "+fmt(next)+" kg",why:"Llegaste al tope ("+p.hi+") en todas las series: "+repsTxt+" con "+fmt(W)+" kg. Objetivo hoy: "+p.lo+"+ reps en todas."+mixNote,from:W};
  }
  if(anyBelow){
    const prev=hist[1]?sideSets(hist[1].sets,side).filter(x=>x.reps!=null&&x.kg===W):[];
    const prevBelow=prev.length&&prev.some(x=>x.reps<p.lo);
    const down=roundStep(W-ex.step);
    if(prevBelow&&down>0&&(W-down)/W<=0.15)return {kg:down,lvl:"down",head:"Baja a "+fmt(down)+" kg",why:"Dos sesiones seguidas por debajo de "+p.lo+" reps con "+fmt(W)+" kg. Baja, haz el rango completo y vuelve a subir."+mixNote};
    return {kg:W,lvl:"keep",head:"Mantén "+fmt(W)+" kg",why:"La última vez: "+repsTxt+". Objetivo: "+p.lo+" reps o más en todas antes de tocar el peso."+(prevBelow?" Llevas 2 sesiones por debajo; bajar sería un salto de más del 15 %, así que mantén y revisa técnica y descanso.":"")+mixNote};
  }
  const minR=Math.min(...lastW.map(x=>x.reps));
  return {kg:W,lvl:"keep",head:"Mantén "+fmt(W)+" kg · +1 rep",why:"La última vez: "+repsTxt+". Saca 1 rep más en la serie más floja ("+minR+"→"+(minR+1)+"). Subes cuando hagas "+p.hi+" en todas."+mixNote};
}
function suggest(exId,dayKey,date){
  const ex=EX[exId],p=presc(dayKey,exId);
  if(!ex||!p)return null;
  if(ex.type==="check")return {lvl:ex.knee?"knee":"info",head:"3 × 5 por dirección",why:"Calidad del aterrizaje por encima de todo. Sin carga."};
  const hist=historyFor(exId,date);
  if(ex.type==="bw"){const l=hist[0];const r=l?l.sets.map(x=>x.reps).join(", "):"–";return {lvl:"knee",head:"3 × 8 · RIR 2-3",why:"La última vez: "+r+". Sin carga añadida. Si una serie acaba con RIR 1 o menos, no hagas la siguiente."}}
  let out;
  if(ex.uni){let L=evalSide(ex,p,hist,"L"),R=evalSide(ex,p,hist,"R");
    // Tren superior: mismo peso en los dos lados; manda el lado más flojo.
    if(!ex.legs&&(L.kg!==R.kg||L.head!==R.head)){const weak=(L.lvl!=="up"&&R.lvl==="up")?L:(R.lvl!=="up"&&L.lvl==="up")?R:(L.kg<=R.kg?L:R);
      const wn=weak===L?"izquierdo":"derecho";weak.why+=" Manda el lado "+wn+": mismo peso en los dos lados.";L=R=weak}
    out={kgL:L.kg,kgR:R.kg,lvl:[L.lvl,R.lvl].includes("up")?"up":[L.lvl,R.lvl].includes("down")?"down":L.lvl,
      head:(L.kg===R.kg&&L.head===R.head)?L.head:"Izq: "+L.head+" · Dcha: "+R.head,
      why:(L.why===R.why?L.why:"Izq: "+L.why+" Dcha: "+R.why)+(ex.legs?"":" Las reps las marca el lado más flojo."),
      upL:L.lvl==="up",upR:R.lvl==="up",fromL:L.from,fromR:R.from};
  }else{const r=evalSide(ex,p,hist,null);out=Object.assign({},r)}
  // Rodilla: la app nunca sube sola carga en pierna.
  if(ex.knee&&(out.lvl==="up")){
    if(ex.uni){out.kgL=out.upL?out.fromL:out.kgL;out.kgR=out.upR?out.fromR:out.kgR}else{out.kg=out.from}
    out.lvl="knee";out.kneeUp=true;
    out.head="Criterio de subida cumplido · se mantiene el peso";
    out.why=out.why.replace(/Sube a [\d,]+ kg/g,"")+" En pierna la app no sube sola: confirma con la fisio que puedes aumentar carga y, si lo autoriza, pulsa el botón.";
  }
  return out;
}
function e1rm(kg,reps){if(kg==null||reps==null||reps<=0)return null;return kg*(1+reps/30)}

/* ============ RANGOS POR MÚSCULO ============ */
const TIERS=[
 {n:"Hierro",c:"#6b6f72"},{n:"Bronce",c:"#a8693a"},{n:"Plata",c:"#8e9aa3"},{n:"Oro",c:"#c79a1c"},
 {n:"Platino",c:"#2f9e98"},{n:"Diamante",c:"#4a7bf0"},{n:"Élite",c:"#b0306a"}];
/* Pecho: 1RM estimado de banca / peso corporal (estándares de fuerza de población, hombres). */
const BENCH_STD=[0,0.5,0.75,1.0,1.25,1.5,1.85];
/* Resto: progreso propio sobre tu primera marca registrada (las máquinas y poleas no tienen estándares fiables entre gimnasios). */
const PROG_STD=[0,1.0,1.05,1.10,1.20,1.30,1.45];
/* Rodilla: simetría pierna operada / sana (1RM estimado). LSI ≥ 90 % es un criterio habitual de vuelta al deporte; la decisión es de la fisio. */
const LSI_STD=[0,0.5,0.6,0.7,0.8,0.9,0.95];
const MUSCLES=[
 {id:"pecho",n:"Pecho",mode:"bench",ex:["banca"]},
 {id:"espalda",n:"Espalda",mode:"prog",ex:["jalon","remo","pullover","jalonCerrado","remoAmplio"]},
 {id:"hombro",n:"Hombro",mode:"prog",ex:["militar","laterales","posterior"]},
 {id:"triceps",n:"Tríceps",mode:"prog",ex:["triceps"]},
 {id:"biceps",n:"Bíceps",mode:"prog",ex:["bayes","martillo","predicador"]},
 {id:"pierna",n:"Rodilla (simetría)",mode:"lsi",ex:["extension","femoral"]}];
function bestE1(sets,ex,side){let b=0;sets.forEach(st=>{if(!st.done)return;
  if(ex.uni){const L=e1rm(st.kgL,st.repsL)||0,R=e1rm(st.kgR,st.repsR)||0;
    const v=side==="L"?L:side==="R"?R:Math.min(L||R,R||L);if(st.repsL<=15&&st.repsR<=15)b=Math.max(b,v)}
  else if(st.reps>=1&&st.reps<=15)b=Math.max(b,e1rm(st.kg,st.reps)||0)});return b||null}
function bodyKg(){let e=Object.entries(S.body).filter(([d,v])=>v&&v.kg!=null).sort((a,b)=>a[0]<b[0]?1:-1);if(e.length){const lim=iso(new Date(new Date(e[0][0]+"T12:00:00").getTime()-13*864e5));e=e.filter(([d])=>d>=lim)}return e.length?e.reduce((s,[d,v])=>s+v.kg,0)/e.length:null}
function tierOf(v,std){let t=0;std.forEach((x,i)=>{if(v!=null&&v>=x&&i>0)t=i});return t}
function muscleRank(m){
  if(m.mode==="bench"){const h=historyFor("banca");const bw=bodyKg();if(!h.length||!bw)return {t:0,v:null,txt:"Sin datos de banca o de peso corporal."};
    const recent=h.slice(0,3);const e=Math.max(...recent.map(x=>bestE1(x.sets,EX.banca)||0));const r=e/bw;const t=tierOf(r,BENCH_STD);
    let next="";if(t<6){const need=BENCH_STD[t+1]*bw;const kg8=need/(1+8/30);next=`Para ${TIERS[t+1].n}: banca ≈ ${fmt(Math.ceil(kg8/2.5)*2.5)} kg × 8 (con ${fmt(bw)} kg de peso corporal).`}
    return {t,v:r,val:r.toFixed(2).replace(".",",")+" × tu peso",txt:`1RM estimado ${fmt(e)} kg / ${fmt(bw)} kg corporales.`,next,pct:t<6?(r-BENCH_STD[t])/(BENCH_STD[t+1]-BENCH_STD[t]):1}}
  if(m.mode==="lsi"){const rs=[];m.ex.forEach(id=>{const h=historyFor(id);if(!h.length)return;const L=bestE1(h[0].sets,EX[id],"L"),R=bestE1(h[0].sets,EX[id],"R");if(L&&R)rs.push(L/R)});
    if(!rs.length)return {t:0,v:null,txt:"Sin datos de extensión ni curl femoral por lados."};
    const r=rs.reduce((a,b)=>a+b,0)/rs.length;const t=tierOf(r,LSI_STD);
    return {t,v:r,val:Math.round(r*100)+" %",txt:"Media de extensión y curl femoral, izquierda frente a derecha. Sube igualando la operada, no metiendo kilos.",next:t<6?`Para ${TIERS[t+1].n}: ${Math.round(LSI_STD[t+1]*100)} % de simetría.`:"",pct:t<6?(r-LSI_STD[t])/(LSI_STD[t+1]-LSI_STD[t]):1}}
  const rs=[];let worst=null;m.ex.forEach(id=>{const h=historyFor(id);if(!h.length)return;const first=bestE1(h[h.length-1].sets,EX[id]);const recent=Math.max(...h.slice(0,2).map(x=>bestE1(x.sets,EX[id])||0));
    if(first&&recent){const r=recent/first;rs.push(r);if(!worst||r<worst.r)worst={id,r,first}}});
  if(!rs.length)return {t:0,v:null,txt:"Sin registros todavía."};
  const r=rs.reduce((a,b)=>a+b,0)/rs.length;const t=tierOf(r,PROG_STD);
  return {t,v:r,val:(r>=1?"+":"")+fmt((r-1)*100)+" %",txt:"Mejora media de tu 1RM estimado frente a tu primera marca registrada.",next:t<6?`Para ${TIERS[t+1].n}: +${Math.round((PROG_STD[t+1]-1)*100)} % de media. El que más tira hacia abajo: ${EX[worst.id].n}.`:"",pct:t<6?Math.max(0,(r-PROG_STD[t])/(PROG_STD[t+1]-PROG_STD[t])):1}}
function allRanks(){const o={};MUSCLES.forEach(m=>o[m.id]=muscleRank(m).t);return o}
function badge(t,size){const c=TIERS[t].c;const gem=t>=5;return `<svg viewBox="0 0 48 56" width="${size}" height="${size*56/48}" aria-hidden="true"><path d="M24 2 44 10v18c0 13-9 22-20 26C13 50 4 41 4 28V10z" fill="${c}"/><path d="M24 7 39 13v15c0 10-7 17-15 21-8-4-15-11-15-21V13z" fill="#fff" opacity=".18"/>${gem?`<path d="M16 22h16l-8 14z M16 22l4-5h8l4 5" fill="#fff" opacity=".9"/>`:`<text x="24" y="35" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="18" fill="#fff">${["I","B","P","O","PT","",""][t]}</text>`}</svg>`}
function viewRangos(){
  let h=`<h2>Rangos por músculo</h2><div class="ranks">`;
  MUSCLES.forEach(m=>{const r=muscleRank(m);
    h+=`<div class="rank" style="--tc:${TIERS[r.t].c}">${badge(r.t,44)}<div class="ri"><div class="row" style="justify-content:space-between;gap:6px"><b>${esc(m.n)}</b><span class="tier">${TIERS[r.t].n}</span></div>
     <div class="rv num">${r.v!=null?esc(r.val):"–"}</div><div class="rbar"><span style="width:${Math.round(100*Math.min(1,Math.max(0,r.pct||0)))}%"></span></div>
     <div class="small muted">${esc(r.txt)} ${esc(r.next||"")}</div></div></div>`});
  h+=`</div><details><summary>Cómo se calcula</summary><p class="small muted">Pecho: 1RM estimado de banca dividido por tu peso corporal (media de las últimas pesadas). Escala: Bronce 0,5×, Plata 0,75×, Oro 1×, Platino 1,25×, Diamante 1,5×, Élite 1,85×, en línea con estándares de fuerza de población para hombres (orientativos). Resto del tren superior: no hay estándares fiables para máquinas y poleas (cada gimnasio pesa distinto), así que compites contra ti: Plata +5 %, Oro +10 %, Platino +20 %, Diamante +30 %, Élite +45 % sobre tu primera marca. Rodilla: no puntúa kilos, puntúa simetría, para no empujarte a cargar la pierna sin aval de la fisio. Solo cuentan series de 15 reps o menos.</p></details>`;
  return h;
}

function fmt0(n){return n==null?"":String(n).replace(".",",")}
function setsText(sets,ex){
  if(ex.type==="check")return sets.length+" series hechas";

  return sets.map((x,i)=>`S${i+1}: ${ex.type==="bw"?"":fmt(x.kg)+" kg × "}${x.reps??"–"}${x.rir!=null?" (RIR "+x.rir+")":""}`).join(" · ");
}
function summaryCard(){
  const ses=curSession(false);const R=routine()[selDay];
  const total=R.ex.reduce((a,e)=>a+e[1],0);
  let done=0,ton=0;
  if(ses)for(const [id,v] of Object.entries(ses.ex)){(v.sets||[]).forEach(st=>{if(st.done){done++;if(st.kg&&st.reps)ton+=st.kg*st.reps;if(st.kgL&&st.repsL)ton+=st.kgL*st.repsL;if(st.kgR&&st.repsR)ton+=st.kgR*st.repsR}})}

  <p class="small muted" style="margin:0">Todo se guarda al escribir. Las sugerencias de la próxima sesión salen de lo que apuntes hoy: apunta las reps y el RIR reales de cada serie.</p></div>`;
}

   <p class="small muted" style="margin:0">El 1RM estimado combina peso y reps en un número para comparar sesiones; es aproximado y pierde precisión por encima de 10 reps.</p></div>`;
  if(ex.legs){const l=hist[hist.length-1];const kL=mode(l.sets.map(s=>s.kgL)),kR=mode(l.sets.map(s=>s.kgR));
    const first=hist[0];const fL=mode(first.sets.map(s=>s.kgL)),fR=mode(first.sets.map(s=>s.kgR));
    h+=`<div class="card"><h3>Pierna operada frente a sana</h3><div class="grid2"><div class="stat"><span class="v num">${kL&&kR?Math.round(100*kL/kR):"–"} %</span><span class="l">peso izq / dcha (${dmy(l.date)})</span></div><div class="stat"><span class="v num">${fL&&fR?Math.round(100*fL/fR):"–"} %</span><span class="l">al empezar a registrar (${dmy(first.date)})</span></div></div><p class="small muted" style="margin:0">Peso a reps parecidas en máquina: orientativo. Enséñaselo a la fisio; el criterio de alta es suyo.</p></div>`;
  }
  h+=`<div class="card"><h3>Sesiones</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Series</th></tr></thead><tbody>${hist.slice().reverse().map(x=>`<tr><td class="num">${dmy(x.date)}</td><td>${esc(setsText(x.sets,ex))}</td></tr>`).join("")}</tbody></table></div></div>`;
  return h;
}
function lineChart(pts,names){
  const W=600,H=220,pl=44,pr=14,pt=14,pb=30;
  const vals=pts.flatMap(p=>[p.a,p.b]).filter(v=>v!=null);
  if(!vals.length)return `<div class="empty">Sin datos suficientes.</div>`;
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<4){lo-=2;hi+=2}const pad=(hi-lo)*0.12;lo=Math.floor(lo-pad);hi=Math.ceil(hi+pad);
  const t0=new Date(pts[0].d).getTime(),t1=new Date(pts[pts.length-1].d).getTime()||t0+1;
  const X=d=>pts.length===1?(pl+(W-pl-pr)/2):pl+(W-pl-pr)*((new Date(d).getTime()-t0)/Math.max(1,t1-t0));
  const Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g="";const ticks=4;for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks;g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${Math.round(v)}</text>`}
  const xl=[pts[0],pts[Math.floor(pts.length/2)],pts[pts.length-1]].filter((p,i,a)=>a.indexOf(p)===i);
  xl.forEach(p=>{g+=`<text x="${X(p.d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${dmy(p.d)}</text>`});
  const series=[["a","var(--accent)"],["b","var(--knee)"]].slice(0,names.length);
  series.forEach(([k,c])=>{const ps=pts.filter(p=>p[k]!=null);if(!ps.length)return;
    g+=`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${ps.map(p=>X(p.d)+","+Y(p[k])).join(" ")}"/>`;
    ps.forEach((p,i)=>{g+=`<circle cx="${X(p.d)}" cy="${Y(p[k])}" r="${i===ps.length-1?5:3}" fill="${c}"/>`});
    const L=ps[ps.length-1];g+=`<text x="${Math.min(X(L.d),W-pr-2)}" y="${Y(L[k])-9}" text-anchor="end" font-size="12" font-weight="600" fill="${c}" font-family="IBM Plex Mono,monospace">${fmt(L[k])}</text>`;});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de progreso">${g}</svg></div>`;
}

/* ---- Peso y cintura ---- */
function weekKey(ds){const d=new Date(ds+"T12:00:00");const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return iso(d)}
function viewCuerpo(){
  const e=Object.entries(S.body).filter(([d,v])=>v&&v.kg!=null).sort((a,b)=>a[0]<b[0]?-1:1);
  const t=S.body[today()]||{};
  const weeks={};e.forEach(([d,v])=>{const w=weekKey(d);(weeks[w]=weeks[w]||[]).push(v.kg)});
  const wk=Object.entries(weeks).sort((a,b)=>a[0]<b[0]?-1:1).map(([w,a])=>({w,avg:a.reduce((s,x)=>s+x,0)/a.length,n:a.length}));
  const cur=wk[wk.length-1],prev=wk[wk.length-2];
  const delta=cur&&prev?cur.avg-prev.avg:null;const gapW=cur&&prev?Math.max(1,Math.round((new Date(cur.w)-new Date(prev.w))/(7*864e5))):1;const pct=delta!=null?100*delta/prev.avg/gapW:null;
  let verdict="";
  if(pct!=null){
    if(pct>0.2)verdict=`Subiendo (+${fmt(pct)} %/semana). En fase de perder grasa esto no cuadra: revisa con el hilo de nutrición.`;
    else if(pct<-1)verdict=`Bajando más del 1 %/semana (${fmt(pct)} %). Ritmo alto: riesgo de perder músculo y rendimiento.`;
    else if(pct<=-0.4)verdict=`Bajando ${fmt(Math.abs(pct))} %/semana: dentro del ritmo recomendado (0,5-1 %).`;
    else verdict=`Casi estable (${fmt(pct)} %/semana). Una semana sola no basta: mira la tendencia de 2-3 semanas.`;
  }
  const waist=Object.entries(S.body).filter(([d,v])=>v&&v.waist!=null).sort((a,b)=>a[0]<b[0]?-1:1);
  let h=`<h2>Peso en ayunas y cintura</h2>
  <div class="card"><div class="row"><label class="f">Fecha<input type="date" id="bDate" value="${today()}"></label><label class="f">Peso (kg)<input class="cell" inputmode="decimal" id="bKg" value="${fmt0(t.kg)}" placeholder="95,4"></label><label class="f">Cintura (cm)<input class="cell" inputmode="decimal" id="bWaist" value="${fmt0(t.waist)}" placeholder="ombligo"></label></div>
  <button class="primary" id="bSave">Guardar</button><p class="small muted" style="margin:0">Pésate al levantarte, después de ir al baño y antes de comer o beber. La cintura, a la altura del ombligo, los lunes de fotos.</p></div>
  <div class="grid2"><div class="stat"><span class="v num">${cur?fmt(cur.avg):"–"}</span><span class="l">media de esta semana (${cur?cur.n:0} pesadas)</span></div>
  <div class="stat"><span class="v num">${prev?fmt(prev.avg):"–"}</span><span class="l">media semana anterior con datos${prev?" ("+dmy(prev.w)+")":""}</span></div>
  <div class="stat"><span class="v num">${delta!=null?(delta>0?"+":"")+fmt(delta):"–"}</span><span class="l">cambio (kg)${gapW>1?" en "+gapW+" semanas":""}</span></div>
  <div class="stat"><span class="v num">${waist.length?fmt(waist[waist.length-1][1].waist):"–"}</span><span class="l">última cintura (cm)</span></div></div>`;
  if(verdict)h+=`<div class="sug ${pct>0.2||pct<-1?"down":pct<=-0.4?"up":"keep"}"><span>${esc(verdict)}</span></div>`;
  if(cur&&cur.n<3)h+=`<p class="small muted" style="margin:0">Con menos de 3 pesadas por semana la media es poco fiable. Objetivo: 4 o más.</p>`;
  if(wk.length)h+=`<div class="card"><h3>Media semanal</h3>${lineChart(wk.map(x=>({d:x.w,a:x.avg})),["kg"])}</div>`;
  h+=`<div class="card"><h3>Registros</h3><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Peso</th><th>Cintura</th><th></th></tr></thead><tbody>${Object.entries(S.body).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,30).map(([d,v])=>`<tr><td class="num">${dmy(d)}</td><td class="num">${fmt(v.kg)}</td><td class="num">${fmt(v.waist)}</td><td><button class="ghost small" data-delbody="${d}" aria-label="Borrar ${dmy(d)}">Borrar</button></td></tr>`).join("")}</tbody></table></div></div>`;
  return h;
}

  const n=Object.keys(S.sessions).length;
  return `<h2>Tus datos</h2>
  <div class="card"><h3>Dónde se guarda</h3><p style="margin:0" class="small">${syncMode==="ok"?"En tu cuenta de Claude (privado: solo tú lo ves) y con copia en este dispositivo. Si cambias de móvil, abre el mismo enlace con tu cuenta.":"Solo en este dispositivo. Exporta una copia de vez en cuando."}</p>
  <div class="grid2"><div class="stat"><span class="v num">${n}</span><span class="l">sesiones</span></div><div class="stat"><span class="v num">${Object.keys(S.body).length}</span><span class="l">pesadas</span></div></div></div>
  <div class="card"><h3>Exportar copia</h3><p class="small muted" style="margin:0">Un archivo JSON con todo: sesiones, peso, rodilla y ajustes. Sirve para pasármelo a mí en el chat y revisar tu progreso.</p>
  <div class="row"><button class="primary" id="exp">Descargar copia</button><button id="expCopy">Copiar al portapapeles</button></div>
  <textarea id="expTxt" hidden readonly></textarea></div>
  <div class="card"><h3>Importar copia</h3><p class="small muted" style="margin:0">Sustituye los datos por los del archivo. Se fusionan las sesiones: si una fecha existe en los dos, gana la del archivo.</p>
  <input type="file" id="impFile" accept=".json,application/json"><textarea id="impTxt" placeholder="…o pega aquí el JSON"></textarea><button id="impBtn">Importar</button></div>
  <div class="card"><h3>Rutina</h3><p class="small muted" style="margin:0">La rutina viene de Notion (9/11/2026). Series, rango, RIR y descanso se cambian dentro de cada ejercicio en Hoy → «ajustes del ejercicio».</p><button id="resetRoutine">Volver a la rutina original</button><div id="resetConfirm" hidden class="row"><span class="small">¿Seguro? Se pierden los ajustes de series y reps.</span><button class="primary" id="resetYes">Sí, restaurar</button></div></div>`;
}

function levelUp(m,t){const d=document.createElement("div");d.className="levelup";d.innerHTML=`<div class="in">${badge(t,72)}<h3>${esc(m.n)}: ${TIERS[t].n}</h3><p class="small muted" style="margin:0">Subes de rango con esta serie.</p><button class="primary" id="luOk">Seguir</button></div>`;document.body.appendChild(d);d.querySelector("#luOk").onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove()}}
/* ============ EVENTOS ============ */
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button");if(!b)return;audio();
  if(b.dataset.day){selDay=b.dataset.day;render();return}
  if(b.dataset.go){tab=b.dataset.go;render();return}
  if(b.dataset.done){const [ex,i]=b.dataset.done.split(":");const ses=curSession(true);const e=ses.ex[ex]=ses.ex[ex]||{sets:[]};
    // recoge los valores visibles de la fila
    document.querySelectorAll(`[data-f^="${ex}:${i}:"]`).forEach(inp=>{const f=inp.dataset.f.split(":")[2];(e.sets[i]=e.sets[i]||{})[f]=num(inp.value)});
    const before=allRanks();const st=e.sets[i]=e.sets[i]||{};st.done=!st.done;ses.updated=Date.now();markDirty(docIdForSession(ses.id));
    if(st.done){const p=presc(selDay,ex);const sets=p?p.sets:3;const name=EX[ex].n;startTimer(p?p.rest:90,(+i+1<sets?name+" · serie "+(+i+2):"Siguiente ejercicio"))}
    render();if(st.done){const after=allRanks();const up=MUSCLES.find(m=>after[m.id]>before[m.id]);if(up)levelUp(up,after[up.id])}return}
  if(b.dataset.kneeup){const ex=b.dataset.kneeup;const chk=document.querySelector(`[data-auth="${ex}"]`);
    if(!chk||!chk.checked){toast("Marca primero que la fisio lo ha autorizado.");return}
    const e=EX[ex];const sg=suggest(ex,selDay,selDate);
    document.querySelectorAll(`[data-f^="${ex}:"]`).forEach(inp=>{const f=inp.dataset.f.split(":")[2];
      if(f==="kg"&&sg.kg!=null)inp.value=fmt0(roundStep(sg.kg+e.step));
      if(f==="kgL"&&sg.upL)inp.value=fmt0(roundStep(sg.kgL+e.step));
      if(f==="kgR"&&sg.upR)inp.value=fmt0(roundStep(sg.kgR+e.step));});
    const ses=curSession(true);const x=ses.ex[ex]=ses.ex[ex]||{sets:[]};x.note=((x.note||"")+" Subida autorizada por la fisio ("+dmy(selDate)+").").trim();ses.updated=Date.now();markDirty(docIdForSession(ses.id));
    toast("Peso subido un escalón. Queda anotado.");return}
  if(b.id==="bSave"){const d=$("#bDate").value||today();const kg=num($("#bKg").value),w=num($("#bWaist").value);
    if(kg==null&&w==null){toast("Escribe el peso o la cintura.");return}
    if(kg!=null&&(kg<40||kg>200)){toast("Ese peso no parece correcto: revisa la coma.");return}
    S.body[d]=Object.assign({},S.body[d],kg!=null?{kg}:{},w!=null?{waist:w}:{});markDirty("body");toast("Guardado "+dmy(d));render();return}
  if(b.dataset.delbody){delete S.body[b.dataset.delbody];markDirty("body");render();return}
  if(b.id==="kSave"){S.knee[today()]={dolor:num($("#kDolor").value),hinch:$("#kHinch").value,trote:num($("#kTrote").value),nada:num($("#kNada").value),nota:$("#kNota").value.trim()};markDirty("knee");toast("Rodilla guardada");render();return}
  if(b.id==="authSave"){S.config.auth=$("#auth").value;markDirty("config");toast("Autorizaciones guardadas");return}
  if(b.id==="exp"||b.id==="expCopy"){const data=JSON.stringify(S,null,1);const name="entreno-yassir-"+today()+".json";
    if(b.id==="exp"){try{const dl=await window.claude?.use?.("downloads");if(dl){await dl.save({filename:name,data});toast("Copia descargada");return}}catch(e){if(e&&e.code==="declined")return}
      try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;a.click();}catch(e){}
      toast("Si no se descarga, usa «Copiar al portapapeles».");return}
    try{await navigator.clipboard.writeText(data);toast("Copiado")}catch(e){const t=$("#expTxt");t.hidden=false;t.value=data;t.select();toast("Selecciona y copia el texto")}return}
  if(b.id==="impBtn"){let txt=$("#impTxt").value.trim();const f=$("#impFile").files[0];if(f)txt=await f.text();
    try{const d=JSON.parse(txt);if(!d||typeof d!=="object"||!d.sessions)throw 0;
      Object.assign(S.sessions,d.sessions);Object.assign(S.body,d.body||{});Object.assign(S.knee,d.knee||{});if(d.config)S.config=Object.assign(S.config,d.config);
      Object.keys(d.sessions).forEach(id=>{S.sessions[id].updated=Date.now();dirty.add(docIdForSession(id))});["body","knee","config"].forEach(k=>dirty.add(k));markDirty("config");toast("Importado: "+Object.keys(d.sessions).length+" sesiones");render()}
    catch(e){toast("El archivo no es una copia válida de esta app.")}return}
  if(b.id==="resetRoutine"){$("#resetConfirm").hidden=false;return}
  if(b.id==="resetYes"){S.config.routine=null;markDirty("config");toast("Rutina original restaurada");render();return}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="selDate"){selDate=t.value||today();const d=new Date(selDate+"T12:00:00");selDay=DAYKEYS[d.getDay()];render();return}
  if(t.id==="exSel"){selEx=t.value;render();return}
  if(t.dataset.f){const [ex,i,f]=t.dataset.f.split(":");const ses=curSession(true);const e=ses.ex[ex]=ses.ex[ex]||{sets:[]};
    // al escribir en una serie, guarda también el peso visible (así el peso sugerido queda registrado)
    document.querySelectorAll(`[data-f^="${ex}:${i}:"]`).forEach(inp=>{const k=inp.dataset.f.split(":")[2];(e.sets[i]=e.sets[i]||{})[k]=num(inp.value)});
    ses.updated=Date.now();markDirty(docIdForSession(ses.id));
    if(EX[ex].stopRule&&f==="rir")render();return}
  if(t.dataset.note!==undefined){const ex=t.dataset.note;const ses=curSession(true);const e=ses.ex[ex]=ses.ex[ex]||{sets:[]};e.note=t.value;ses.updated=Date.now();markDirty(docIdForSession(ses.id));return}
  if(t.dataset.cfg){const [ex,col]=t.dataset.cfg.split(":");const r=S.config.routine=S.config.routine||JSON.parse(JSON.stringify(DAYS));const row=r[selDay].ex.find(x=>x[0]===ex);if(!row)return;
    row[+col]=+col===4?t.value:Math.max(1,parseInt(t.value)||row[+col]);markDirty("config");render();return}
  if(t.id==="kbDolor"||t.id==="kbHinch"){const ses=curSession(true);ses.kneeBefore={dolor:$("#kbDolor").value,hinch:$("#kbHinch").value};ses.updated=Date.now();markDirty(docIdForSession(ses.id));render();return}
  if(t.id==="shDolor"){const ses=curSession(true);ses.shoulder=t.value;ses.updated=Date.now();markDirty(docIdForSession(ses.id));if((+t.value||0)>0)toast("Hombro con dolor: hoy sin pullover. Para cualquier ejercicio que lo provoque.");return}
});
initStore();
</script>
